<style>
/* Layout: one reading column on cream paper. Home is a chain of "links"; finishing a block anchors that link. Each block opens a one-step-per-screen runner. */
:root{
  color-scheme:light;
  --bg:#F6EFDF; --surface:#FFFBF2; --sunk:#EEE5D1; --ink:#14203A; --muted:#5C6070; --line:#DCD1B9;
  --pri:#A8520A; --on-pri:#FFFFFF; --navy:#14203A; --blue:#2B5DA8;
  --good:#1D7F45; --warn:#9C6410; --bad:#B3322A; --chg:#7A4BB5;
  --good-bg:#DDF1E5; --warn-bg:#F6EBD6; --bad-bg:#F7E0DD; --chg-bg:#EEE6F8; --blue-bg:#E3ECF8;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;line-height:1.02}
h1 em{font-style:normal;color:var(--pri)}
h2{font-size:clamp(1.35rem,4.2vw,1.75rem);font-weight:600;line-height:1.2}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;gap:7px;align-items:center;margin-right:auto;background:none;border:0;padding:4px 0;cursor:pointer}
.brand i{width:16px;height:16px;border-radius:50%;border:3px solid var(--pri);box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(168,82,10,.3)}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.tbtn[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.tbtn .mono{font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--pri);color:var(--on-pri);min-height:48px;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.9rem}
.btn.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
.btn.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.actions .btn{flex:1 1 140px}
.keys{font-size:.78rem;color:var(--muted);width:100%}

.hero{padding-block:34px 18px;display:grid;gap:14px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);font-weight:600}
.lede{color:var(--muted);max-width:60ch}
.statline{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.statline b{color:var(--ink);font-variant-numeric:tabular-nums}
.part{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px 30px}

.chain{list-style:none;margin:6px 0 0;padding:0;display:grid}
.chain li{position:relative;padding-left:30px}
.chain li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.chain li.done::before{background:var(--good)}
.node{position:absolute;left:3px;top:19px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bad);background:var(--bg)}
.done .node{background:var(--good);border-color:var(--good)}
.nextup .node{border-color:var(--pri);box-shadow:0 0 0 4px rgba(168,82,10,.18)}
.blk{display:grid;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;cursor:pointer}
.blk:hover{border-color:var(--pri)}
.nextup .blk{border:2px solid var(--pri)}
.blk-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.blk h3{font-size:1.15rem}
.blk p{color:var(--muted);font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--good);color:#fff;border-color:var(--good)}
.chip.next{color:var(--pri);border-color:var(--pri)}
.chip.start{color:var(--blue);border-color:var(--blue)}
.chip.chg{color:var(--chg);border-color:var(--chg)}
.chip.sec{color:var(--muted)}
.homefoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--bad);border-radius:12px;background:var(--bad-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.runhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:18px}
.runhead .t{font-size:.82rem;color:var(--muted);margin-right:auto;min-width:0}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 18px}
.dots i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.dots i.d{background:var(--good)} .dots i.c{background:var(--ink)} .dots i.r{background:var(--warn)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,30px) 24px}
.kicker{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kicker .re{color:var(--warn)}
.lbl{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.lay{display:grid;gap:12px;margin-top:14px;max-width:65ch}
.simple{font-size:1.1rem;line-height:1.5}
.ex{background:var(--sunk);border-radius:12px;padding:12px 14px}
.ex .lbl{color:var(--warn)}
.pro{border-left:4px solid var(--blue);padding:4px 0 4px 12px;font-size:.95rem}
.pro .lbl{color:var(--blue)}
.means{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:.92rem}
.means b{color:var(--ink)}
.chgbox{background:var(--chg-bg);border:1px solid #CDB8EA;border-radius:12px;padding:12px 14px;font-size:.95rem}
.chgbox .lbl{color:var(--chg)}
.trap{background:var(--bad-bg);border-radius:12px;padding:12px 14px;font-size:.95rem}
.trap .lbl{color:var(--bad)}
.body{display:grid;gap:12px;margin-top:14px;max-width:65ch}
.body ul,.body ol,.ex ul,.ex ol,.simple ul,.simple ol,.chgbox ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.hook{margin-top:18px;border:1px dashed var(--pri);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.hook span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);font-weight:600}
.script p{font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.stat b{font-family:var(--f-display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.84rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--f-mono)}
td.id{font-family:var(--f-mono);font-weight:600;color:var(--pri);white-space:nowrap}
.src{font-size:.82rem;color:var(--muted)}
.bands{display:grid;grid-template-columns:30fr 20fr 20fr 20fr 20fr;border-radius:10px;overflow:hidden;font-size:.8rem;font-weight:700;color:#fff}
.bands div{padding:8px 6px;line-height:1.15}
.bands small{display:block;font-weight:400;opacity:.92;font-family:var(--f-mono);font-size:.7rem}

.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .k,.bucket .k{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:.95rem}
.tip{color:var(--muted);margin-top:8px}
.ans{margin-top:16px;padding:14px 16px;border-left:4px solid var(--pri);background:var(--sunk);border-radius:0 12px 12px 0;display:grid;gap:8px}
.ans ul,.ans ol{margin:0;padding-left:1.2em;display:grid;gap:5px}
.timer-row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.tval{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.tval.over{color:var(--bad)}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.numrow input{font:inherit;font-family:var(--f-mono);font-size:1.2rem;width:9em;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink)}
.numrow input.ok{border-color:var(--good);background:var(--good-bg)} .numrow input.no{border-color:var(--bad);background:var(--bad-bg)}

.slots{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px;counter-reset:s}
.slot{counter-increment:s;border:1px dashed var(--line);border-radius:10px;padding:8px 12px 8px 40px;min-height:42px;position:relative;font-size:.95rem}
.slot::before{content:counter(s);position:absolute;left:12px;top:8px;font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;font-size:.93rem;min-height:44px}
.pick:hover:not(:disabled){border-color:var(--pri)}
.pick.used{visibility:hidden}
.shake{animation:shake .35s;border-color:var(--bad)!important;background:var(--bad-bg)!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.sort-item{margin-top:18px;border:2px solid var(--ink);border-radius:14px;padding:16px 18px;font-size:1.08rem;font-weight:700;display:grid;gap:6px;min-height:90px;background:var(--bg)}
.sort-item .mono{font-size:.75rem;color:var(--muted);font-weight:400}
.fb{min-height:1.6em;margin-top:10px;font-size:.95rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.bucket{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:56px}
.bucket .k{justify-self:start}
.bucket small{color:var(--muted);font-size:.78rem}
.bucket:hover:not(:disabled){background:var(--sunk);border-color:var(--pri)}
.bucket:disabled{opacity:.5;cursor:default}

.done-box{display:grid;gap:14px;text-align:left}
.agebox{font-size:clamp(.9rem,2.6vw,1.05rem);background:var(--sunk);border-radius:10px;padding:12px 14px}
.agebox b{color:var(--good)}

.sheet{display:grid;gap:14px;padding-top:22px}
.sheet section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.sheet ul{margin:0;padding-left:1.15em;display:grid;gap:4px}
.sheet .sn{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sheet section.chg{border:2px solid var(--chg)}

.brk{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.brk .card{background:var(--surface);border:2px solid var(--pri);border-radius:18px;padding:24px;max-width:420px;display:grid;gap:14px}

/* idea map */
.maphead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-top:22px}
.maphead > div{display:grid;gap:8px;min-width:0}
.mh{font-size:clamp(1.8rem,5vw,2.4rem)}
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;min-height:32px}
.lg i,.gdot,.conn i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;margin-top:12px}
.graph svg{display:block;cursor:grab}
.ln{stroke:var(--line);stroke-width:1.4}
.ln.hot{stroke:var(--pri);stroke-width:2.4;stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
.ln.dim{opacity:.1}
@keyframes flow{to{stroke-dashoffset:-24}}
.ll{font:600 10px var(--f-mono);fill:var(--ink);opacity:0;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.ll.show{opacity:1}
.nd{cursor:pointer}
.nd circle{stroke:var(--surface);stroke-width:2;transition:stroke-width .2s}
.nd.on circle{stroke:var(--ink);stroke-width:3.5}
.nd.dim{opacity:.16}
.nl{font:700 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;pointer-events:none}
.mpanel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px clamp(16px,4vw,26px)}
.tournav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.ch{margin-top:18px}
.conns{display:grid;gap:6px;margin-top:8px}
.conn{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.93rem;min-height:44px}
.conn i{margin-top:6px}
.conn em{font-style:normal;color:var(--muted)}
.conn:hover{border-color:var(--pri)}

/* score lab */
.lab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:700px){.lab{grid-template-columns:1fr}}
.sigs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sig{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:.9rem}
.sig:hover{background:var(--sunk)}
.sig input{width:18px;height:18px;accent-color:var(--pri);margin:0}
.sig .p{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.sig .p.neg{color:var(--good)}
.grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 6px 2px}
.res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.score{font:800 3.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.gauge{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--good) 0 30%,#B8962E 30% 50%,#C97A2A 50% 70%,#B54A12 70% 90%,var(--bad) 90%);position:relative;margin:12px 0 4px}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-2px);transition:left .25s}
.pill{display:inline-block;font:700 .75rem/1 var(--f-mono);padding:6px 9px;border-radius:7px;color:#fff}
.a-allow{background:var(--good)}.a-warn{background:#B8962E}.a-check{background:#C97A2A}.a-hold{background:#B54A12}.a-block{background:var(--bad)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.presets button{font:600 .8rem/1 var(--f-mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const $ =(s, el=document) => el.querySelector(s);

const BANDS = `<div class="bands"><div style="background:var(--good)">0–29 Allow<small>pay at once</small></div><div style="background:#B8962E">30–49 Warn<small>pay + notify</small></div><div style="background:#C97A2A">50–69 Check<small>LuxTrust question</small></div><div style="background:#B54A12">70–89 Hold<small>person calls</small></div><div style="background:var(--bad)">90+ Block<small>session ends</small></div></div>`;

const BLOCKS = [
/* ═════════════ PART A · FOUNDATIONS ═════════════ */
{id:'basics', part:'A · Foundations', start:1, title:'Basics in plain words', sub:'The banking and fraud ideas everything else is built on. Start here.', mins:20, steps:[
 {t:'card', tag:'Basic 1 of 14', h:'Account takeover (ATO): someone else moves your money',
  simple:`A criminal gets control of your online banking, <b>or</b> talks you into sending the money yourself, and the money goes to an account the criminal controls.`,
  ex:`Someone copies your house key. The lock still opens, so the lock cannot tell it isn't you. A password works the same way: the bank sees the right password, not the person typing it.`,
  pro:`"TrustAge targets account takeover, in which a criminal gains control of a customer's online banking, or steers the customer, and sends money to an account the criminal controls" (§2).`, means:`<b>Steers</b> = manipulates the real customer, for example a fake bank employee on the phone telling them what to type.`},
 {t:'card', tag:'Basic 2 of 14', h:'LDB: a brand-new bank with no history',
  simple:`Luxembourg Digital Bank is a <b>fictional</b>, fully digital bank. Customers use only a web app. It is new, so it has <b>no record of past transfers</b> and no fraud cases to learn from.`,
  ex:`A new restaurant with zero reviews. You can't judge it by its past; you have to judge it by what you can see today.`,
  pro:`The brief: "capture ATO fraud in online checking accounts by analysing the wire transfers." We play consultants advising LDB. No historical dataset is supplied.`, means:`<b>Wire transfer</b> = an ordinary bank transfer (here: SEPA credit transfer). <b>Checking account</b> = a current account.`},
 {t:'card', tag:'Basic 3 of 14', h:'Standard vs instant transfer',
  simple:`A <b>standard</b> SEPA transfer must arrive by the end of the <b>next business day</b> (we call this <b>D+1</b>). An <b>instant</b> transfer must reach the other bank within <b>10 seconds</b>, any time of day.`,
  ex:`Standard is like a letter: there is a little time to stop it. Instant is like a text message: once it's sent, it's gone.`,
  pro:`Instant Payments Regulation 2024/886: execution within 10 seconds. PSD2 Art. 83: a standard transfer is credited by the end of the next business day.`, means:`That is why TrustAge must answer in under 0.3 s, and why every held payment must be decided by D+1.`},
 {t:'card', tag:'Basic 4 of 14', h:'Strong customer authentication (SCA) via LuxTrust',
  simple:`Every transfer already needs two proofs, such as password + a code on the LuxTrust app. That is SCA. But SCA only checks that someone <b>has</b> the codes, not <b>who</b> is using them.`,
  ex:`A doorman who checks that your key fits but never looks at your face.`,
  pro:`A2: "Every transfer already passes strong customer authentication (SCA) through LuxTrust, as PSD2 Art. 97 requires. TrustAge adds to SCA because takeover fraud usually gets through it."`, means:`Takeovers pass SCA with <b>stolen or relayed codes</b>, or because the <b>real customer</b> approves a payment a criminal is steering.`},
 {t:'mcq', must:1, q:'Why is SCA not enough on its own?', opts:['It proves someone has the codes, not that the right person is acting freely','It is too slow for instant payments','It is not required by law','It only works on mobile apps'], a:0, why:'Criminals relay codes in real time, steal sessions, or coach the real customer, who then authenticates the payment personally.'},
 {t:'card', tag:'Basic 5 of 14', h:'Verification of Payee (VoP): the name check',
  simple:`When you enter an IBAN and a name, the bank asks the other bank: does this name belong to this account? Four answers: <b>match</b>, <b>close match</b>, <b>no match</b>, or <b>not possible</b>.`,
  ex:`A parcel addressed to "J. Kovacs" when the mailbox says "J. Kovac": a close match. Addressed to "Maria Lopez": no match.`,
  pro:`A7: VoP results are available for every euro transfer, as the Instant Payments Regulation requires since 9 October 2025. Rule R4 uses the result.`, means:`Mules often hold accounts in <b>other people's names</b>, so a "no match" that the customer ignores is a strong warning.`},
 {t:'card', tag:'Basic 6 of 14', h:'Payee, IBAN, fresh payee',
  simple:`A <b>payee</b> is the person you send money to, identified by an <b>IBAN</b> (the account number). A <b>fresh</b> payee was added less than 24 hours ago. A <b>young</b> payee was added 1–30 days ago.`,
  ex:`Paying your landlord for the 10th time is an old payee. Paying "J. Kovacs", added 10 minutes ago, is a fresh payee.`,
  pro:`If someone <b>edits</b> the IBAN of an existing payee, TrustAge treats it as a new payee: its age resets to zero (R3c).`, means:`A criminal cannot use your old trusted payees, because the money would go to your landlord, not to the criminal.`},
 {t:'card', tag:'Basic 7 of 14', h:'Money mule',
  simple:`An account that receives stolen money and quickly passes it on. Often opened in someone else's name or rented from a student. One mule usually collects from <b>several victims</b>.`,
  ex:`A "post box" the criminal uses to collect parcels from many stolen credit cards.`,
  pro:`R6b: a new IBAN paid by ≥ 3 unrelated LDB customers within 72 hours. Only a bank-wide view can see it.`, means:`A confirmed mule IBAN goes on the <b>mule list</b>; anyone paying it later is blocked (override O1).`},
 {t:'card', tag:'Basic 8 of 14', h:'The six ways criminals take over',
  simple:`<ol><li><b>Phishing / clone site:</b> a fake bank page steals your login.</li><li><b>Real-time relay:</b> the fake site passes your codes to the real bank while you type.</li><li><b>Stolen session cookie (infostealer):</b> malware copies your logged-in session; no login needed.</li><li><b>SIM swap / e-mail takeover:</b> the criminal moves your phone number or e-mail to themselves, then resets your password.</li><li><b>Fake bank, LuxTrust or police caller:</b> you are told your money is in danger and must go to a "safe account".</li><li><b>Remote-access "tech support":</b> you install a screen-sharing app and the criminal works while you watch.</li></ol>`,
  ex:`Luxembourg examples: a fake BILnet site in 2025 cost about 60 clients around €550,000; in October 2026 the police warned about callers posing as bank or LuxTrust staff.`},
 {t:'sort', must:1, kicker:'Who presses the button?', q:'Does the criminal operate the account, or is the real customer coached to pay?', buckets:[{k:'take',label:'Criminal operates it',sub:'takeover'},{k:'coach',label:'Victim pays',sub:'coached / manipulated'}], items:[
   {x:'A fake BILnet page captures the login, and the criminal logs in from his own laptop.',b:'take'},
   {x:'A caller "from LuxTrust" says the account is hacked and dictates a "safe account" IBAN to the customer.',b:'coach'},
   {x:'The criminal moves the customer\'s phone number to his own SIM, then resets the password.',b:'take'},
   {x:'Malware steals a logged-in session cookie and the criminal continues the session.',b:'take'},
   {x:'A fake "investment advisor" convinces the customer to send savings to a new account.',b:'coach'},
   {x:'A "police officer" tells the customer to move money so it can be "protected" during an investigation.',b:'coach'}]},
 {t:'card', tag:'Basic 9 of 14', h:'A fraud detector checks each payment before it leaves',
  simple:`A program that looks at every outgoing transfer <b>before</b> the money is sent and decides: let it go, ask an extra question, or hold it for a person.`,
  ex:`Airport security: most travellers walk through, a few get a bag check, and very few are taken aside.`,
  pro:`The brief requires three parts: a <b>transaction loader</b> (reads and checks the data), a <b>fraud engine</b> (spots potential fraud), and a <b>report engine</b> (shows results for human review).`},
 {t:'card', tag:'Basic 10 of 14', h:'Rules vs machine learning',
  simple:`<b>Rules</b> are written by people ("if the payee is new and the amount is big, add points"). <b>Machine learning</b> learns patterns from many past examples with known answers.`,
  ex:`Rules = a recipe you write down. Machine learning = a chef who learned by tasting thousands of dishes. A new bank has no dishes yet to taste.`,
  pro:`The brief says ML is optional, and any use must explain its data requirements. TrustAge uses no ML at launch (§9.3).`, means:`A supervised model needs a few hundred <b>labelled</b> frauds; LDB would see about 25 in four months.`},
 {t:'card', tag:'Basic 11 of 14', h:'Odds and "doubling the odds"',
  simple:`Odds compare fraud to genuine: "1 to 19,999" means 1 fraud for every 19,999 honest payments. A clue that is 2× more common in fraud <b>doubles</b> the odds.`,
  ex:`Rain: dark clouds are 4× more common before rain. Seeing dark clouds multiplies the odds of rain by 4. Wind from the sea doubles them again: now 8×.`,
  pro:`TrustAge's scale: every +7 points doubles the odds of fraud. +14 = 4×, +21 = 8×, +70 ≈ 1,000×.`, means:`Because clues <b>multiply</b> the odds, taking the logarithm lets us simply <b>add</b> points.`},
 {t:'card', tag:'Basic 12 of 14', h:'The base rate: fraud is rare',
  simple:`Out of 20,000 transfers we plan with <b>1</b> account-takeover fraud. Even strong evidence starts from that tiny base.`,
  ex:`A test for a very rare illness: even a good test gives many false alarms, because there are so few sick people to begin with.`,
  pro:`A3: "We plan with 1 ATO fraud in 20,000 transfers and use this rate only to translate scores into odds." It is deliberately cautious, because criminals target new digital banks early, and is replaced by LDB's measured rate from month 1.`, means:`So 70 points (×1,000) gives about <b>1 in 20</b> held payments being fraud, not 70%.`},
 {t:'card', tag:'Basic 13 of 14', h:'Labels: finding out afterwards what was fraud',
  simple:`A label is the confirmed answer for a past payment: fraud or genuine. Labels come from analyst calls, customer claims, recalls and "no complaint after 60 days".`,
  ex:`Like getting your corrected exam back: now you know which answers were right.`,
  pro:`Labels feed the weekly recount (§9). A block alone never counts as fraud, so the detector cannot "prove itself right".`},
 {t:'card', tag:'Basic 14 of 14', h:'Three lines of defence',
  simple:`<b>1st line</b> does the work (analysts, fraud lead, TrustAge itself). <b>2nd line</b> checks the work (risk). <b>3rd line</b> independently audits it (internal audit).`,
  ex:`A restaurant: the cooks (1st), the manager checking quality (2nd), the health inspector (3rd).`,
  pro:`In the TOM: TrustAge, analysts, the 24/7 desk, on-call analyst and fraud lead are 1st line; Risk is 2nd line (monthly learning report, KPIs); Internal audit is 3rd line (results store, table versions).`},
 {t:'mcq', q:'A customer sends €4,800 to a payee added 10 minutes ago. Which word describes that payee?', opts:['Fresh','Young','Trusted','Well-known'], a:0, why:'Fresh = added less than 24 hours ago (R3a). Young = 1–30 days. Trusted = paid twice, at least 30 days apart (M1).'},
 {t:'mcq', must:1, q:'An instant payment is held by TrustAge. What must happen by law within 10 seconds?', opts:['LDB refuses the instant order and tells the customer why','The money is sent anyway and recalled later','The customer must call the bank','Nothing: instant payments cannot be held'], a:0, why:'PSD2 Art. 79: a refusal must come with notice and reasons. Under LDB\'s terms (A6) the payment then continues as a standard transfer, decided by D+1.'}
]},

{id:'story', part:'A · Foundations', title:'The whole project as one story', sub:'The brief, our answer in nine lines, and how the design changed', mins:12, steps:[
 {t:'card', tag:'The task', h:'What the professor asked for',
  simple:`Be consultants for LDB. Design a <b>behavioural fraud detector</b> for account takeover on online transfers that is <b>explainable</b>, <b>auditable</b>, usable by a risk officer who can't code, and realistic for a bank's business, operations and regulation.`,
  ex:`<ul><li>Three parts: transaction loader, fraud engine, report engine.</li><li>A <b>TOM</b> (how people use the detector) and an <b>architecture</b> (how the parts connect).</li><li>4 to 10 rules, each with purpose, attributes, trigger, threshold, reason and priority.</li><li>Data attributes with source, purpose and essential/supplementary.</li><li>How it works with no history; ML optional.</li><li>How rules can be updated and new ones added without redesign.</li></ul>`,
  pro:`Course: Corporate Risk Assessment & Digital Transformation (Dimitrios Kampas). Team project 70%, individual oral 30%.`},
 {t:'card', tag:'Timeline', h:'Four dates',
  simple:`<ol><li><b>10 October</b>: first proposal, 5–6 slides.</li><li><b>17 October</b>: almost-final design with report mockups.</li><li><b>24 October</b>: final report submitted (our 29-page PDF).</li><li><b>7 November</b>: oral exam, 10 min presentation + 7 min individual Q&A.</li></ol>`,
  ex:`The professor's feedback on 10 October shaped everything: the architecture was "too wide, unnecessary players"; he wanted a concrete explanation of how scores are assigned; and he asked how the detector adapts without human intervention. We also learned LDB is a <b>new</b> bank, so our old assumption of 24 months of history was dropped.`},
 {t:'card', tag:'Our answer', h:'TrustAge in nine lines (Table 1)',
  body:`<div class="tbl-wrap"><table><tbody>
  <tr><th>Checks</th><td>Every outgoing SEPA transfer (standard and instant) from LDB's web app, in under 0.3 s</td></tr>
  <tr><th>Core idea</th><td>Every takeover adds a new link (device, phone or payee); TrustAge scores how recently each link appeared</td></tr>
  <tr><th>Rules</th><td>8 rules with 27 scored signals, a mule-list check, 5 good signs and 4 fixed overrides</td></tr>
  <tr><th>Points</th><td>One formula, 7 × log₂(F/G); every +7 points doubles the odds of fraud</td></tr>
  <tr><th>Who decides</th><td>The detector alone below 70 points; a person decides every hold after a scripted call-back</td></tr>
  <tr><th>Adapting</th><td>A weekly recount of F and G within 9 safety rails, with no manual step</td></tr>
  <tr><th>New bank</th><td>Trust is anchored at verified onboarding, so no transaction history is needed</td></tr>
  <tr><th>Tested</th><td>Desk check of 17 scenarios: 9 of 12 frauds stopped, 2 slowed, 1 missed; all 5 genuine paid</td></tr>
  <tr><th>Cost</th><td>About €230,000 one-off and €430,000 a year, about €0.48 per transfer in year 1</td></tr></tbody></table></div>`, hook:`A criminal can steal a password, but cannot make a link old.`},
 {t:'card', tag:'The name', h:'Why "TrustAge"',
  simple:`Trust grows with <b>age</b>. A device, phone or payee that has been with the customer for months is trustworthy; one that appeared minutes ago is not. A criminal can copy a password, but cannot fake the passing of time.`,
  ex:`A new face at your front door holding your key is suspicious, even if the key works.`},
 {t:'card', tag:'What changed', h:'From the 10 October proposal to the final design',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Topic</th><th>10 Oct</th><th>Final</th><th>Why</th></tr></thead><tbody>
  <tr><td>Architecture</td><td>Customer, LuxTrust, receiving bank, CSSF, four roles</td><td>Only LDB's systems: 3 parts, 1 loop, 2 people</td><td>"Too wide"</td></tr>
  <tr><td>Points</td><td>Expert bands (strong 30–50, medium 15–25, weak 5–10)</td><td>7 × log₂(F/G)</td><td>Explain each score</td></tr>
  <tr><td>Adapting</td><td>Fraud lead retunes monthly</td><td>Weekly automatic recount, rails, veto</td><td>No human intervention</td></tr>
  <tr><td>History</td><td>24 months of transfers assumed</td><td>None; trust from onboarding</td><td>LDB is new</td></tr>
  <tr><td>Reports</td><td>Described in words</td><td>Five mockups</td><td>Asked for 17 Oct</td></tr>
  <tr><td>Intervention</td><td>"Analyst calls the customer"</td><td>4-step call-back, tiered 24/7 cover</td><td>2 analysts can't cover 24/7</td></tr></tbody></table></div><p class="src">Report §1, Table 2</p>`},
 {t:'card', tag:'After the PDF', h:'What happened after 24 October',
  simple:`We kept working: we reviewed the report critically, built a <b>working prototype</b> that runs the whole detector on synthetic data, made an explainer video and the final 10-slide deck.`,
  chg:`The prototype and the review produced a few <b>clarifications</b> (for example, how many points a missing field adds) and some <b>honest results</b> (for example, about 80% of takeovers stopped in simulation). Block "Changed since the PDF" lists all of them. This app always teaches the <b>current</b> version.`},
 {t:'order', must:1, q:'Put the project milestones in order.', items:['First proposal, 5–6 slides (10 Oct)','Almost-final design with report mockups (17 Oct)','Final report submitted (24 Oct)','Oral exam: 10 min + 7 min Q&A (7 Nov)']},
 {t:'mcq', must:1, q:'Which feedback did the professor give on 10 October?', opts:['Architecture too wide; explain how points are set; adapt without human intervention','Use machine learning; add more rules; add card fraud','Make the report longer; remove the call-back','Use 24 months of history'], a:0, why:'Those three points (plus "LDB is a new bank") drove the redesign: only LDB\'s systems, one formula, and a weekly automatic recount.'}
]},

/* ═════════════ PART B · THE DESIGN ═════════════ */
{id:'purpose', part:'B · The design, chapter by chapter', title:'Purpose and the fraud we target', sub:'§1–2: why LDB needs it, the attack routes, the one weakness of every route', mins:12, steps:[
 {t:'card', tag:'§1 · Purpose', h:'What LDB needs',
  simple:`A detector that <b>stops account takeover on outgoing transfers before the money leaves</b>, <b>explains every decision</b>, and <b>works from the first day</b> without any fraud history. It must also be affordable for a small bank.`,
  pro:`"LDB needs a detector that stops account takeover on outgoing transfers before the money leaves, explains every decision, and works from the first day without any fraud history" (§1).`},
 {t:'card', tag:'§1 · Background', h:'The numbers behind the problem',
  ex:`<div class="stats"><div class="stat"><b>€2.2 bn</b><span>credit-transfer fraud in the EEA, 2024, up 16% (EBA–ECB)</span></div><div class="stat"><b>~60</b><span>clients lost ~€550,000 to a fake BILnet site (2025)</span></div><div class="stat"><b>700+</b><span>phishing complaints in Luxembourg, 2024–2025</span></div><div class="stat"><b>10 s</b><span>for an instant payment to reach the payee's bank</span></div></div>`,
  simple:`<b>Manipulation of the payer</b> (coached victims) is the fastest-growing type. In October 2026 the Luxembourg police warned about callers posing as bank or LuxTrust staff.`},
 {t:'card', tag:'§2 · The core idea', h:'Every route has to add something new',
  simple:`Whatever the route, before the money moves the criminal must add a <b>new link</b> between the account and the money: a new device, a new network, a changed phone, a new payee, or a destination that strangers also pay. The rules look for that new link.`,
  ex:`The real owner: device and phone verified at onboarding 92 days ago, payee paid twice. A takeover: device first seen 2 minutes ago, phone changed 2 days ago, payee added 10 minutes ago.`,
  pro:`"Every takeover puts a new link between the account and the money, such as a device, a phone number or a payee, and a criminal cannot make that link old" (abstract).`},
 {t:'card', tag:'§2 · Table 3', h:'Eight routes and the link each cannot avoid',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Route</th><th>Cannot avoid</th><th>Caught by</th></tr></thead><tbody>
  <tr><td>Phishing / clone site</td><td>Device and network never used, then a payee never paid</td><td class="id">R2, R3</td></tr>
  <tr><td>Real-time relay</td><td>Session jumps to criminal's network and browser, then payee added/edited</td><td class="id">R2c, R3, O2</td></tr>
  <tr><td>SIM swap / e-mail takeover</td><td>Phone, e-mail, password or LuxTrust changed shortly before</td><td class="id">R1</td></tr>
  <tr><td>Stolen session cookie</td><td>No login, but session continues from a new network and fingerprint</td><td class="id">R2c</td></tr>
  <tr><td>Fake caller, safe account, remote access</td><td>Never-paid payee, often draining, often after a name warning</td><td class="id">R3, R4, R5, R7, O4</td></tr>
  <tr><td>Editing a trusted payee's IBAN</td><td>An edited IBAN is a new payee: age resets</td><td class="id">R3c</td></tr>
  <tr><td>Low and slow: tests, splitting, waiting, dormant</td><td>Money still lands at a fresh payee; 72-h totals</td><td class="id">R1c, R5, R8</td></tr>
  <tr><td>Mules collecting from many victims</td><td>One new IBAN paid by several unrelated customers</td><td class="id">R6</td></tr></tbody></table></div>`},
 {t:'sort', must:1, kicker:'Which rule catches it?', q:'Match the attack to the rule that catches it first.', buckets:[{k:'R1',label:'R1',sub:'control change'},{k:'R2',label:'R2',sub:'new access'},{k:'R3',label:'R3',sub:'fresh payee'},{k:'R6',label:'R6',sub:'risky destination'}], items:[
   {x:'Phone number moved to a new SIM yesterday, then €3,000 to a new payee.',b:'R1'},
   {x:'Login from a laptop never seen before, on a Tor network.',b:'R2'},
   {x:'Landlord\'s IBAN edited this morning, name kept the same.',b:'R3',why:'R3c: an edited IBAN is a new payee.'},
   {x:'Third unrelated LDB customer this weekend paying the same new Lithuanian IBAN.',b:'R6',why:'R6b, the crowd signal.'},
   {x:'Session suddenly continues from a different network and browser fingerprint.',b:'R2',why:'R2c, a stolen cookie or relay.'},
   {x:'Password reset 2 hours ago from a new e-mail, then money out.',b:'R1'}]},
 {t:'card', tag:'§2 · Scope', h:'What TrustAge does not cover',
  simple:`<b>Out of scope:</b> card fraud, cheques, and fraud by the account owner. <b>Partly covered:</b> coached victims who pay from their own device to a name that matches.`,
  ex:`A customer who sends money to a romance scammer from her own laptop, to a name that checks out, leaves almost no new link. TrustAge slows her down rather than stopping her.`},
 {t:'mcq', q:'Why does TrustAge look at new links rather than "is this unusual for the customer"?', opts:['Unusual-for-the-customer needs months of history that a new bank lacks; link age only needs the onboarding record','Because criminals always use VPNs','Because PSD2 forbids behaviour profiles','Because it is cheaper to store'], a:0, why:'§10: "A check of whether a payment is unusual for the customer would need months of data." Was this link verified at onboarding or added later? That needs no history.'},
 {t:'recall', must:1, q:'Say the purpose of TrustAge in one sentence, and the core idea in one more.', ans:`<p><b>Purpose:</b> stop account takeover on outgoing transfers before the money leaves, explain every decision, and work from day one without history.</p><p><b>Core idea:</b> every takeover adds a new link (device, phone, payee); TrustAge measures how old each link is, because a criminal cannot make a link old.</p>`}
]},

{id:'assume', part:'B · The design, chapter by chapter', title:'The eight assumptions', sub:'§2.1: A1–A8, what each means and why it is safe', mins:10, steps:[
 {t:'card', tag:'A1 · A2', h:'New bank; SCA already in place',
  simple:`<b>A1:</b> LDB is new and has no transaction history. Trust is anchored at <b>onboarding</b> (eKYC + LuxTrust registration). <b>A2:</b> every transfer already passes SCA through LuxTrust (PSD2 Art. 97); TrustAge adds to it.`,
  ex:`eKYC = online identity check at account opening: photo of your ID plus a selfie. The device and phone used then become "anchored".`},
 {t:'card', tag:'A3 · A4 · A5', h:'Fraud rate, volume, speed',
  simple:`<b>A3:</b> plan with 1 ATO fraud in 20,000 transfers, only to turn scores into odds; cautious because criminals target new banks; replaced by the measured rate from month 1. <b>A4:</b> about 2,500 transfers a day at first. <b>A5:</b> the payment hub calls TrustAge before executing and waits up to 0.5 s.`,
  pro:`The EEA credit-transfer fraud rate was about 0.001% of value in 2024; 1 in 20,000 is deliberately more pessimistic.`},
 {t:'card', tag:'A6 · A7 · A8', h:'Contract, name check, estimates',
  simple:`<b>A6:</b> LDB's terms allow a payment to be held for a safety check, and an instant order to continue as a standard transfer (PSD2 Art. 79 needs a contractual basis to refuse). <b>A7:</b> VoP is available for every euro transfer (since 9 Oct 2025). <b>A8:</b> the starting F values are estimates (public cases, a 40-scenario library, team judgement), labelled as such and replaced by real counts.`,
  ex:`A6 is like the small print in your phone contract that lets the operator block your SIM if it is stolen.`},
 {t:'sort', must:1, kicker:'Which assumption?', q:'Which assumption makes this possible?', buckets:[{k:'a1',label:'A1',sub:'anchored at onboarding'},{k:'a3',label:'A3',sub:'1 in 20,000'},{k:'a6',label:'A6',sub:'terms allow a hold'},{k:'a8',label:'A8',sub:'F starts as estimate'}], items:[
   {x:'A held instant payment continues as a standard transfer.',b:'a6'},
   {x:'A score of 70 is translated into "about 1 in 20 is fraud".',b:'a3'},
   {x:'The device used at account opening is trusted from day one.',b:'a1'},
   {x:'R3a starts with F = 70% before LDB has seen a single fraud.',b:'a8'},
   {x:'LDB may refuse a payment it suspects, with a reason.',b:'a6'}]},
 {t:'mcq', q:'Which assumption is the weakest, and how does the design protect against it?', opts:['A8, the starting F values: labelled estimates, a factor-2 error moves only 7 points, and the weekly recount replaces them','A4, the volume: it is fixed forever','A7, VoP: it may never exist','A2, SCA: it is optional'], a:0, why:'The log scale makes errors cheap, the estimate only counts as 20 cases, and real outcomes overwrite it. A3 (the fraud rate) is second weakest; it is replaced by the measured rate from month 1.'},
 {t:'recall', q:'List all eight assumptions in a few words each.', ans:`<ol><li>A1 new bank, trust from onboarding</li><li>A2 SCA on every transfer</li><li>A3 plan 1 in 20,000</li><li>A4 about 2,500 transfers a day</li><li>A5 hub waits up to 0.5 s</li><li>A6 terms allow hold and instant → standard</li><li>A7 VoP for every euro transfer</li><li>A8 starting F values are estimates</li></ol>`}
]},

{id:'tom', part:'B · The design, chapter by chapter', title:'Target operating model (TOM)', sub:'§3: who does what, the four-step call-back, 24/7 coverage', mins:15, steps:[
 {t:'card', tag:'§3 · In one sentence', h:'The machine decides most; people decide the holds',
  simple:`TrustAge decides every payment below <b>70 points</b> on its own, in under a second. At 70 or more the payment is held and a <b>person decides</b>, always after a scripted call. The detector changes its own points weekly; the fraud lead reads the log and can veto.`,
  ex:`A self-checkout in a supermarket: most items scan by themselves; when something odd happens, a staff member comes over.`,
  pro:`Three layers: automatic (TrustAge) · first line, people, 24/7 · oversight (fraud lead, risk, audit). Answers from the call flow back into the learning loop.`},
 {t:'card', tag:'§3 · Table 4', h:'Who does what',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Role</th><th>Line</th><th>Decides</th></tr></thead><tbody>
  <tr><td>TrustAge (automatic)</td><td>1st</td><td>Every payment below 70; its own table changes, within the rails</td></tr>
  <tr><td>Fraud analysts (2, in-house)</td><td>1st</td><td>Holds and blocks in office hours; morning check of every overnight decision; customer fraud claims and complaints</td></tr>
  <tr><td>24/7 operations desk</td><td>1st</td><td>Same script at night and weekends; may stop any payment; may release a clean hold (70–89) up to €10,000</td></tr>
  <tr><td>On-call analyst</td><td>1st</td><td>Blocks (90+), holds above €10,000, cases the desk can't settle; by phone within 1 h</td></tr>
  <tr><td>Fraud lead</td><td>1st</td><td>Reads weekly log; veto/rollback; scam-wave warning; four eyes on overrides</td></tr>
  <tr><td>Risk</td><td>2nd</td><td>Monthly learning report, KPIs; challenges appetite and rules</td></tr>
  <tr><td>Internal audit</td><td>3rd</td><td>Results store and table versions; independent assurance</td></tr></tbody></table></div>`},
 {t:'card', tag:'§3.1 · Step 1', h:'Call the safe phone',
  simple:`LDB calls the customer. It <b>never</b> asks the customer to call a number from an SMS or e-mail. The <b>safe phone</b> is the number trusted for 30+ days or anchored at onboarding. Opening line: "LDB will never ask you for a code, a password or to move money."`,
  ex:`Like a bank calling you back on the number on your card, never the one in a suspicious message.`,
  trap:`After a <b>SIM swap</b>, the criminal may answer the real number. So when R1 fired or the device is new, a voice answer is not enough: the customer must also confirm <b>in the app on the anchored device</b>, or pass an <b>in-app video identification</b> against the eKYC selfie.`},
 {t:'card', tag:'§3.1 · Steps 2–4', h:'"Did you make this payment?", open questions, decide',
  simple:`<b>Step 2:</b> "Did you make this payment?" <b>No</b> → takeover: stop, sign out all devices, reset login and LuxTrust, IBAN on the mule list, ask the receiving bank to recall. <b>Yes</b> → step 3.<br><b>Step 3:</b> open questions, because coached victims are given yes/no answers to repeat: How did you first hear of this payee? What is it for, in your own words? Has anyone claiming to be LDB, the police or an investment firm contacted you? Were you asked to move money to keep it safe? Is anyone on the line with you?<br><b>Step 4:</b> release if clean; stop with a warning if a third party is directing it; if unsure, wait until the D+1 cut-off and call once more. A customer who insists after a warning is referred to the fraud lead.`,
  pro:`The analyst ticks the answers on the alert card, so each call is recorded and becomes a label for learning.`},
 {t:'order', must:1, q:'Put the call-back steps in order.', items:['Call the safe phone (in-app confirmation if R1 fired or the device is new)','Ask "Did you make this payment?"','Ask open questions about the payee, the purpose and any caller','Release, stop, or pause to the D+1 cut-off, and record the answers']},
 {t:'card', tag:'§3.2 · Coverage', h:'Why two analysts cannot cover the clock',
  simple:`Volume is small (about 2 holds a day planned, capacity 30). The hard part is <b>speed at any hour</b>: P1 within 15 minutes and P2 within 1 hour, day and night. One seat staffed 24/7 needs about <b>5 people</b> (168 hours a week ÷ about 33 hours a person actually works).`,
  ex:`Office hours: the 2 analysts. Nights and weekends: LDB's 24/7 operations desk with the same script. Escalation: one analyst on call.`,
  pro:`On-call duty with a short response time counts as working time (CJEU, Matzak, C-518/15). A trained first line is enough at night because a held payment is safe by default: the money has not left. If outsourced: EBA outsourcing guidelines and CSSF Circular 22/806 (written contract, LDB keeps the rules, recorded calls, monthly sample audit).`},
 {t:'card', tag:'§3.2 · Edge cases', h:'Unreachable customers, scam waves, old channels',
  simple:`<ul><li><b>P3</b> alerts wait for the next business day, still within D+1.</li><li><b>Unreachable</b> after two calls and an in-app message: the payment is <b>refused</b> at the D+1 cut-off. A hold is never released by default.</li><li><b>Scam wave:</b> the fraud lead sends an in-app warning to all customers; the queue is sorted by amount at risk.</li><li>For <b>30 days</b> after a phone, e-mail or LuxTrust change, warnings also go to the <b>old</b> phone and e-mail, so they don't reach only the criminal.</li></ul>`},
 {t:'mcq', must:1, q:'At 2 a.m. a clean hold of €14,000 (score 75) arrives. Who can release it?', opts:['The on-call analyst; the 24/7 desk may only release clean holds up to €10,000','The 24/7 desk, any amount','Nobody until the morning','TrustAge releases it automatically after 1 hour'], a:0, why:'The desk may release clean holds (70–89) up to €10,000 and may stop any payment. Holds above €10,000 and all blocks go to the on-call analyst. No hold is ever released automatically.'},
 {t:'mcq', q:'Why is a 24/7 operations desk with a script safe enough at night?', opts:['A held payment has not left the bank, so the risk is only delay','The desk can change the rules','Fraud never happens at night','The desk uses machine learning'], a:0, why:'Holding is safe by default; the night shift protects customer experience and speed, not the bank\'s money.'},
 {t:'recall', q:'Explain the TOM in 30 seconds.', ans:`<p>Every transfer is scored by TrustAge in under 0.3 s. Below 70 it decides alone: allow, warn or an extra LuxTrust check. At 70+ the payment is held and a person decides after the same four-step call-back: safe phone, "did you make it?", open questions, decide by D+1. Analysts in office hours, the 24/7 desk at night, an on-call analyst for blocks and €10k+. Every answer becomes a label for the weekly learning; the fraud lead can veto; risk and audit oversee.</p>`}
]},

{id:'arch', part:'B · The design, chapter by chapter', title:'Architecture', sub:'§4: the parts, their inputs and outputs, instant payments, fail mode', mins:10, steps:[
 {t:'card', tag:'§4 · In one sentence', h:'Everything lives inside LDB',
  simple:`Before sending any transfer, the <b>payment hub</b> asks TrustAge "is this safe?" and gets an answer in under 0.3 s. The customer, LuxTrust, the receiving bank and the CSSF are outside the detector, so the diagram leaves them out.`,
  pro:`This answers the 10 October feedback that the first architecture was "too wide, unnecessary players".`},
 {t:'card', tag:'§4 · Table 5', h:'The components, in order',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Component</th><th>Input → Output</th></tr></thead><tbody>
  <tr><td>Online banking + payment hub</td><td>The customer's transfer → asks the detector; sends only if allowed</td></tr>
  <tr><td><b>1 · Transaction loader</b></td><td>Order + bank records (logins, devices, security changes, KYC, payees, mule list) → one checked record; missing essential fields flagged</td></tr>
  <tr><td>Attribute builder</td><td>Checked record → link ages (from onboarding), 72-hour totals, number of customers paying this IBAN</td></tr>
  <tr><td><b>2 · Fraud engine</b></td><td>Attributes + current points table → score, action, reason codes, one plain sentence, in &lt; 0.3 s</td></tr>
  <tr><td>Results store</td><td>Every decision → append-only audit trail with the table version</td></tr>
  <tr><td><b>3 · Report engine + console</b></td><td>Results and outcomes → the five reports</td></tr>
  <tr><td>Auto-tuner</td><td>Outcomes + genuine rates of last 90 days → next points table, only if it passes the safety test</td></tr>
  <tr><td style="color:var(--chg)"><b>Customer claim</b> (added 6 Nov)</td><td>A fraud that got through, reported by the customer → case on the console, linked to the stored decision → label "missed fraud" → KPI page and recount</td></tr></tbody></table></div>`},
 {t:'order', must:1, q:'Follow one payment through the architecture.', items:['Customer orders a transfer in online banking','Payment hub asks TrustAge "is this safe?"','Transaction loader collects and checks the records','Attribute builder computes the link ages','Fraud engine scores with the points table','Answer returns to the hub in under 0.3 s','Decision stored in the results store','Report engine shows held payments in the console']},
 {t:'card', tag:'§4.1 · Instant payments', h:'Keeping the 10-second rule',
  simple:`TrustAge answers in under 0.3 s, so <b>Allow, Warn and a passed Check stay instant</b>. If a 1-hour release, a hold or a block applies, LDB <b>refuses the instant order within the 10 seconds</b> and tells the customer why (PSD2 Art. 79). Under LDB's terms (A6) the payment then continues as a <b>standard transfer</b>, which the customer can still cancel and which must arrive by D+1 (Art. 83).`,
  pro:`Therefore every hold has to be decided by D+1.`},
 {t:'card', tag:'§4.2 · Fail mode', h:'What if TrustAge is down?',
  simple:`If TrustAge is silent for more than 0.5 s, a fixed fallback applies: payments to <b>trusted</b> payees go through; payments of <b>€1,000 or more to fresh payees</b> are not sent as instant and wait as standard transfers until the detector is back. Still down at the D+1 cut-off? An analyst decides them by hand. IT is alerted through the <b>DORA</b> incident process.`,
  ex:`Like traffic lights failing: the main road keeps moving carefully, the risky crossing waits for a police officer.`},
 {t:'mcq', must:1, q:'An instant payment scores 75. What does the customer experience?', opts:['The instant order is refused within 10 s with a reason, and continues as a standard transfer decided by D+1','The money arrives instantly and is recalled later','The payment is silently delayed for a week','The customer must re-enter it tomorrow'], a:0, why:'Refusal with reason (Art. 79), continuation as standard under the terms (A6), decision by D+1 (Art. 83).'},
 {t:'mcq', q:'Where would an auditor look to see why a payment was blocked last March?', opts:['The results store: every decision with its reasons and the table version used','The customer\'s e-mail','The payment hub log only','Nowhere: decisions are not kept'], a:0, why:'The results store is append-only and keeps the table version, so any decision can be explained and replayed later.'},
 {t:'recall', q:'Name the three parts the brief requires and what each does in TrustAge.', ans:`<p><b>1 Transaction loader:</b> collects and checks the bank's records; flags missing essential fields. <b>2 Fraud engine:</b> turns attributes into points, an action, reason codes and a sentence in under 0.3 s. <b>3 Report engine:</b> produces the five reports in the console. In between: the attribute builder (link ages) and the results store (audit trail); around them: the auto-tuner (weekly learning). And when a fraud gets through, the customer's claim opens a case on the console, is linked to the stored decision and counts as missed fraud in the reports and the recount.</p>`}
]},

{id:'data', part:'B · The design, chapter by chapter', title:'Data attributes', sub:'§5 + Appendix B: 34 attributes, essential vs supplementary, privacy', mins:10, steps:[
 {t:'card', tag:'§5 · In one sentence', h:'34 attributes LDB already has; none needs history',
  simple:`TrustAge needs <b>26 essential</b> and <b>8 supplementary</b> attributes, all from systems LDB already runs. The most important is <b>derived</b>: the <b>age of each link</b>, counted from verification at onboarding or first sight afterwards.`},
 {t:'card', tag:'§5 · Table 6', h:'The five essential groups',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Group</th><th>Tells TrustAge</th><th class="n">#</th></tr></thead><tbody>
  <tr><td>Payment</td><td>Amount, time stamp, instant/standard/standing, payee IBAN + name + purpose, balance before/after, 72-h total to fresh payees</td><td class="n">6</td></tr>
  <tr><td>Payee</td><td>Created/edited at, device that created it, times paid, other LDB customers paying it, VoP result, reaction to VoP warning, mule list, biller/notary list</td><td class="n">8</td></tr>
  <tr><td>Access</td><td>Login time and result, device ID (hashed) and first seen, network type, session continuity, last login</td><td class="n">5</td></tr>
  <tr><td>Controls and anchors</td><td>Phone/e-mail/password/LuxTrust changes; what was verified at onboarding; funding account and declared payees; customer since, declared income</td><td class="n">4</td></tr>
  <tr><td>Behaviour and outcomes</td><td>Personal baseline (95th percentile), payments declared in advance, analyst decisions/claims/recalls</td><td class="n">3</td></tr></tbody></table></div>`},
 {t:'card', tag:'Appendix B', h:'The eight supplementary attributes',
  simple:`Session timing (login→confirm, time on confirm page, pasted IBAN) · remote-access indicator · LDB pass-through account · crypto/e-money payee flag · clone-site and phishing alerts · salary in the last 3 days · IP reputation score · customer age band.`,
  pro:`A supplementary attribute is useful but not required: if its feed is unavailable, its signal scores <b>0</b>.`, means:`The <b>age band</b> is only used to choose the wording of a warning; it is <b>never scored</b>, to avoid unfair treatment. Country alone is never a signal.`},
 {t:'card', tag:'§5 · Missing data', h:'What happens when an essential field is missing',
  simple:`Nothing passes silently. A missing essential field is flagged and <b>counts as risky</b>.`,
  chg:`<span class="lbl">Changed since the PDF</span>The PDF says a missing essential field "is flagged and adds points" but never says how many. The current rule: it scores as the <b>risky value of its own signal</b>. Example: an unknown device age counts as a new device (R2a, +20); a missing name check counts as "VoP not possible" (R4c, +5).`},
 {t:'sort', must:1, kicker:'Essential or supplementary?', q:'Which kind of attribute is this?', buckets:[{k:'E',label:'Essential',sub:'missing = risky'},{k:'S',label:'Supplementary',sub:'missing = 0'}], items:[
   {x:'Payee created at (date and time)',b:'E'},{x:'Remote-access or screen-sharing indicator',b:'S'},{x:'Phone / e-mail / LuxTrust changes with time and device',b:'E'},
   {x:'IP reputation score from a commercial feed',b:'S'},{x:'VoP result',b:'E'},{x:'Time from login to confirm',b:'S'},{x:'Available balance before and after',b:'E'},{x:'Customer age band',b:'S'}]},
 {t:'card', tag:'§5 · Privacy', h:'GDPR and ePrivacy',
  simple:`<ul><li>Device IDs stored only as <b>hashes</b>.</li><li>Every hold and block is reviewed by a <b>person</b>, with reason codes (GDPR Art. 22).</li><li>A <b>DPIA</b> (data protection impact assessment) is done before launch (Art. 35).</li><li>Fraud prevention is a <b>legitimate interest</b> (Recital 47).</li><li>Device fingerprinting limited to what security strictly needs (ePrivacy Art. 5(3)).</li></ul>`,
  ex:`Hashing is like keeping a fingerprint of the device ID instead of the ID itself: you can recognise it again, but you can't read it back.`},
 {t:'mcq', q:'Why is the customer\'s age band never scored?', opts:['To avoid unfair treatment; it only chooses the warning wording','Because it is not available','Because older people are never defrauded','Because the AI Act forbids storing age'], a:0, why:'Scoring age would treat people differently for who they are rather than what happened. It is only used to phrase warnings.'},
 {t:'recall', q:'Name the five essential groups with their counts.', ans:`<p>Payment 6 · Payee 8 · Access 5 · Controls and onboarding anchors 4 · Behaviour and outcomes 3 = 26 essential, plus 8 supplementary = 34.</p>`}
]},

{id:'logic', part:'B · The design, chapter by chapter', title:'Scoring logic: how a case gets its points', sub:'§6: the formula, why 7 and 70, F and G, double counting, score bands', mins:18, steps:[
 {t:'card', tag:'§6 · The formula', h:'points = 7 × log₂(F / G)',
  simple:`For each signal we ask two questions. <b>F</b>: out of 100 frauds, in how many does the signal appear? <b>G</b>: out of 100 genuine payments, in how many? F/G says how much more likely fraud becomes when we see the signal. The formula turns that into points, rounded to the nearest 5 (halves round up).`,
  ex:`A payee added today: in 70 of 100 frauds, but only 8 of 100 genuine payments. 70 ÷ 8 = 8.75 times more likely. 7 × log₂(8.75) = 7 × 3.13 = 21.9 → <b>+20 points</b>.`,
  pro:`F/G is a likelihood ratio. Its logarithm is the weight of evidence (I. J. Good, 1950); credit scorecards use the same "points to double the odds" scaling (Siddiqi, 2006).`, means:`<b>log₂</b> asks "how many times do I double to get there?" 8.75 is about 3 doublings (2 → 4 → 8), so 3 × 7 ≈ 21 points.`},
 {t:'num', must:1, q:'R2a (device first seen < 24 h): F = 55%, G = 6%. How many points? (Round to the nearest 5.)', ans:20, tol:0, work:'55 ÷ 6 = 9.17 · log₂ 9.17 = 3.20 · 7 × 3.20 = 22.4 → +20'},
 {t:'card', tag:'§6 · The scale', h:'Every 7 points doubles the odds',
  simple:`+7 = 2× · +14 = 4× · +21 = 8× · +70 = 2¹⁰ ≈ <b>1,000×</b>. Because of the logarithm, evidence that <b>multiplies</b> the odds can simply be <b>added</b>, and the sum still has a meaning in odds.`,
  ex:`From planning odds 1 : 19,999, a score of 75 gives 2^(75/7) = 2^10.7 ≈ 1,680; 1,680 ÷ 19,999 ≈ 0.084, so about <b>1 in 13</b> such payments is fraud.`},
 {t:'card', tag:'§6.1 · Why 7 and 70', h:'The hold line is a business decision',
  simple:`7 was chosen so that the hold line of 70 means the evidence multiplied the odds by ~1,000. At 1 in 20,000 that makes about <b>1 in 20</b> held payments fraudulent. With an assumed average loss of <b>€5,000</b>, each hold prevents about <b>€250</b> of expected loss, far more than ~15 minutes of analyst time.`,
  pro:`What limits the hold line is analyst capacity and customer friction, not the money.`, means:`€5,000 × 1/20 = €250 per hold.`},
 {t:'num', q:'A hold prevents on average (1 in 20) × €5,000. How many euros of expected loss is that per hold?', ans:250, tol:0, work:'5,000 ÷ 20 = 250'},
 {t:'card', tag:'§6.2 · Where F and G come from', h:'G is measured, F starts as an estimate',
  simple:`<b>G is measured</b>: more than 99.9% of payments are genuine, so 30 days of LDB traffic (~75,000 transfers) gives every G to within a few hundredths of a percentage point. <b>F starts as an estimate</b>: the share of the 40 library scenarios in which the signal appears, each weighted by how common its route is in public reports and police warnings. The team reviews it; real cases correct it.`,
  pro:`"The logarithm limits the damage of a poor estimate, since an F that is wrong by a factor of two moves the points by only 7."`},
 {t:'card', tag:'§6.3 · No double counting', h:'Three protections',
  simple:`<ol><li><b>Add-on signals</b> (R3c edited IBAN, R3d amount far above normal, R4d purpose) are measured <b>only among payments that already have a fresh payee</b>, so they add new information.</li><li><b>Caps:</b> in R2 and R5, whose signals often fire together, the total is capped at the rule's strongest signal (today +50 and +35); the cap moves if the tuner changes that signal.</li><li><b>Good signs</b> together are capped at <b>−40</b> and never cancel an override.</li></ol>`,
  pro:`The calibration check (Rail 9) tests whether the summed score still matches reality.`},
 {t:'card', tag:'§6 · Table 7', h:'Score to action',
  body:`${BANDS}<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Score</th><th>Action</th><th>Odds</th></tr></thead><tbody>
  <tr><td class="n">0–29</td><td><b>Allow</b>: pay at once</td><td>under 1 in 1,000</td></tr>
  <tr><td class="n">30–49</td><td><b>Warn</b>: pay, notify the owner (also old phone/e-mail after a change)</td><td>1 in 1,000 – 1 in 160</td></tr>
  <tr><td class="n">50–69</td><td><b>Check</b>: second LuxTrust confirmation showing amount, payee and "Has anyone asked you to make this payment?" (yes → O4); plus a cancellable 1-hour release if the payee is new and ≥ €1,000</td><td>1 in 140 – 1 in 23</td></tr>
  <tr><td class="n">70–89</td><td><b>Hold</b>: the payment waits; the call-back decides</td><td>1 in 20 – 1 in 4</td></tr>
  <tr><td class="n">90+</td><td><b>Block</b>: session ends, access blocked, call-back within 1 h</td><td>1 in 4 or more</td></tr></tbody></table></div><p class="src">Screens show 0–100; the odds use the raw sum.</p>`},
 {t:'sort', must:1, kicker:'Which action?', q:'What does TrustAge do at this score?', buckets:ACT5, items:[
   {x:'Score 25',b:'allow'},{x:'Score 45',b:'warn'},{x:'Score 65',b:'check'},{x:'Score 75',b:'hold'},{x:'Score 135, shown as 100',b:'block'},{x:'Score 70 exactly',b:'hold'},{x:'Score −10, shown as 0',b:'allow'}]},
 {t:'card', tag:'§6.5 · Priorities', h:'P1, P2, P3',
  simple:`<b>P1</b>: answered within <b>15 minutes</b>, 24/7. <b>P2</b>: within <b>1 hour</b>. <b>P3</b>: next business day. A case takes the <b>highest</b> priority among the signals that fired; overrides are always P1.`,
  ex:`The alert-card case (A-0042) is P1 because R1b (phone changed 24–72 h ago) is a P1 signal, even though its other signals are P2.`},
 {t:'mcq', q:'Why does a score of 70 not mean "70% chance of fraud"?', opts:['Points shift the odds from a tiny base rate; 70 points ≈ ×1,000 on 1 in 20,000 ≈ 1 in 20','Because the score is capped at 100','Because 70 is a percentile','It does mean 70%'], a:0, why:'Points are on a log-odds scale. A common trap: always translate a score through the base rate.'},
 {t:'num', must:1, q:'A good sign: M1 trusted payee, F = 5%, G = 60%. Points? (Write the minus sign.)', ans:-25, tol:0, work:'5 ÷ 60 = 0.083 · log₂ 0.083 = −3.58 · 7 × −3.58 = −25.1 → −25'},
 {t:'recall', must:1, q:'Explain the scoring to an executive in 30 seconds.', ans:`<p>Every signal gets its points from one formula: 7 × log₂ of F over G, where F is how often it appears in fraud and G how often in genuine payments. Every 7 points doubles the odds, so 70 points means the odds are about a thousand times the base rate: roughly 1 held payment in 20 is fraud. Below 70 the machine decides; above, a person calls. G is measured on our own traffic in 30 days; F starts as an estimate and is corrected weekly.</p>`}
]},

{id:'rules', part:'B · The design, chapter by chapter', title:'The eight rules and all 27 signals', sub:'Appendix A in plain words: every signal, its F, G, points and priority', mins:22, steps:[
 {t:'card', tag:'Overview', h:'Eight rules, five good signs, four overrides',
  simple:`<ol><li><b>R1</b> control change, then money out</li><li><b>R2</b> unfamiliar access</li><li><b>R3</b> fresh payee with value at risk</li><li><b>R4</b> name or purpose contradiction</li><li><b>R5</b> drain and split</li><li><b>R6</b> risky destination</li><li><b>R7</b> scripted or coached session</li><li><b>R8</b> probe, wake or set-and-forget</li></ol>Plus <b>M1–M5</b> good signs (at most −40) and <b>O1–O4</b> overrides that must never pass.`,
  pro:`The rules cover the transaction-monitoring factors of the PSD2 SCA standards (Reg. 2018/389 Art. 2): compromised credentials (R1, R2c), amount (R3d, R5), known fraud scenarios (R6, R8, library), signs of malware (R7b), abnormal device use (R2a).`},
 {t:'card', tag:'R1 · Control change, then money out', h:'SIM swap and account-recovery attacks',
  simple:`Phone, e-mail, password or LuxTrust changed recently, then ≥ €500 to a fresh or young payee (72-h total). The points <b>fade</b> with time instead of stopping, so waiting a day doesn't reset the risk.`,
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Change was</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R1a</td><td>&lt; 24 h ago</td><td class="n">35%</td><td class="n">0.3%</td><td class="n">+50</td><td>P1</td></tr>
  <tr><td class="id">R1b</td><td>24–72 h ago</td><td class="n">10%</td><td class="n">0.4%</td><td class="n">+35</td><td>P1</td></tr>
  <tr><td class="id">R1c</td><td>3–7 days ago</td><td class="n">6%</td><td class="n">1%</td><td class="n">+20</td><td>P2</td></tr></tbody></table></div>`,
  ex:`A criminal moves your number to his SIM at 9 a.m., resets the password at 9:05, adds a payee at 9:10 and sends €3,000. R1a fires: +50.`},
 {t:'card', tag:'R2 · Unfamiliar access (cap +50)', h:'Stolen credentials, relays, stolen cookies',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R2a</td><td>Device first seen &lt; 24 h ago</td><td class="n">55%</td><td class="n">6%</td><td class="n">+20</td><td>P2</td></tr>
  <tr><td class="id">R2b</td><td>Hosting provider, VPN or Tor</td><td class="n">15%</td><td class="n">3%</td><td class="n">+15</td><td>P2</td></tr>
  <tr><td class="id">R2c</td><td>Network + browser fingerprint change mid-session</td><td class="n">20%</td><td class="n">0.15%</td><td class="n">+50</td><td>P1</td></tr></tbody></table></div>`,
  simple:`R2b is weak on purpose: many cross-border workers in Luxembourg use VPNs. R2c is the signature of a stolen session cookie or a fake-site relay. Together R2 can add at most +50.`},
 {t:'card', tag:'R3 · Fresh payee with value at risk', h:'The money must reach an account new to the victim',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th></tr></thead><tbody>
  <tr><td class="id">R3a</td><td>Payee added &lt; 24 h ago, payment ≥ €500</td><td class="n">70%</td><td class="n">8%</td><td class="n">+20</td></tr>
  <tr><td class="id">R3b</td><td>Young payee (1–30 days), ≥ €500</td><td class="n">15%</td><td class="n">6%</td><td class="n">+10</td></tr>
  <tr><td class="id">R3c</td><td>+ IBAN of an existing payee was edited</td><td class="n">11%</td><td class="n">2.5%</td><td class="n">+15</td></tr>
  <tr><td class="id">R3d</td><td>+ amount &gt; 2× the customer's 95th percentile</td><td class="n">50%</td><td class="n">15%</td><td class="n">+10</td></tr></tbody></table></div><p class="src">All P2. The "+" signals are add-ons, measured only among fresh-payee payments.</p>`,
  ex:`95th percentile = the amount that 95% of your past payments stay below. If you usually pay €150–800, double that is about €1,600; €4,800 is far above.`},
 {t:'card', tag:'R4 · Name or purpose contradiction', h:'Mules in other names; scam scripts',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R4a</td><td>VoP "no match" and the customer continues</td><td class="n">25%</td><td class="n">1%</td><td class="n">+35</td><td>P2</td></tr>
  <tr><td class="id">R4b</td><td>VoP "close match"</td><td class="n">10%</td><td class="n">3%</td><td class="n">+10</td><td>P2</td></tr>
  <tr><td class="id">R4c</td><td>VoP not possible</td><td class="n">5%</td><td class="n">2.5%</td><td class="n">+5</td><td>P3</td></tr>
  <tr><td class="id">R4d</td><td>+ purpose contradicts the payee ("security transfer", "invoice" to a person)</td><td class="n">20%</td><td class="n">4%</td><td class="n">+15</td><td>P2</td></tr></tbody></table></div>`,
  simple:`"Missing evidence is never a free pass": even an impossible name check adds a little.`},
 {t:'card', tag:'R5 · Drain and split (cap +35)', h:'Emptying the account, even in pieces',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal (72-h total to fresh or young payees)</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th></tr></thead><tbody>
  <tr><td class="id">R5a</td><td>≥ 50% of the balance</td><td class="n">60%</td><td class="n">5%</td><td class="n">+25</td></tr>
  <tr><td class="id">R5b</td><td>≥ 80% of the balance</td><td class="n">40%</td><td class="n">1%</td><td class="n">+35</td></tr>
  <tr><td class="id">R5c</td><td>≥ 3× the customer's usual</td><td class="n">45%</td><td class="n">9%</td><td class="n">+15</td></tr></tbody></table></div><p class="src">All P2. Summing over 72 hours defeats splitting into small pieces.</p>`},
 {t:'card', tag:'R6 · Risky destination', h:'Mule accounts',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R6a</td><td>Payee IBAN on the mule list</td><td colspan="3">→ override O1</td><td>P1</td></tr>
  <tr><td class="id">R6b</td><td>New IBAN paid by ≥ 3 unrelated LDB customers in 72 h</td><td class="n">10%</td><td class="n">0.2%</td><td class="n">+40</td><td>P1</td></tr>
  <tr><td class="id">R6c</td><td>Payee is an LDB account passing money on within hours</td><td class="n">5%</td><td class="n">0.3%</td><td class="n">+30</td><td>P1</td></tr>
  <tr><td class="id">R6d</td><td>First payment to a crypto or e-money provider</td><td class="n">10%</td><td class="n">3%</td><td class="n">+10</td><td>P2</td></tr></tbody></table></div>`,
  simple:`R6c means LDB itself may host a mule; that case also goes to AML. Crypto is hard to recall once converted.`},
 {t:'card', tag:'R7 · Scripted or coached session', h:'Scripts, remote access, coached victims',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R7a</td><td>Login to confirm &lt; 30 s with a pasted IBAN</td><td class="n">20%</td><td class="n">4%</td><td class="n">+15</td><td>P2</td></tr>
  <tr><td class="id">R7b</td><td>Remote-access tool active</td><td class="n">10%</td><td class="n">0.3%</td><td class="n">+35</td><td>P2</td></tr>
  <tr><td class="id">R7c</td><td>Pause &gt; 3 min on the confirm page</td><td class="n">25%</td><td class="n">8%</td><td class="n">+10</td><td>P3</td></tr></tbody></table></div>`,
  simple:`Scripts are faster than humans (R7a). A long pause often means the victim is waiting for the caller's next instruction (R7c). R7b is P2, not P1, because detection in a browser is less reliable than in a mobile app.`},
 {t:'card', tag:'R8 · Probe, wake or set-and-forget', h:'Tests, dormant accounts, standing orders, retries',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Signal</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th><th>P</th></tr></thead><tbody>
  <tr><td class="id">R8a</td><td>Test ≤ €10, then ≥ 20× to the same payee within 48 h</td><td class="n">10%</td><td class="n">2%</td><td class="n">+15</td><td>P3</td></tr>
  <tr><td class="id">R8b</td><td>Account dormant ≥ 90 days wakes up with a transfer</td><td class="n">8%</td><td class="n">2%</td><td class="n">+15</td><td>P3</td></tr>
  <tr><td class="id">R8c</td><td>New or edited standing order to a fresh payee</td><td class="n">5%</td><td class="n">1%</td><td class="n">+15</td><td>P3</td></tr>
  <tr><td class="id">R8d</td><td>≥ 3 declined or held attempts in 24 h</td><td class="n">6%</td><td class="n">0.5%</td><td class="n">+25</td><td>P2</td></tr></tbody></table></div>`,
  chg:`<span class="lbl">Noted after the PDF</span>R8b cannot fire before month 4: in a bank younger than 90 days no account can be dormant for 90 days. It switches itself on later.`},
 {t:'card', tag:'M1–M5 · Good signs (together at most −40)', h:'How honest customers get through',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Good sign</th><th class="n">F</th><th class="n">G</th><th class="n">Pts</th></tr></thead><tbody>
  <tr><td class="id">M1</td><td>Trusted payee: paid twice, ≥ 30 days apart</td><td class="n">5%</td><td class="n">60%</td><td class="n">−25</td></tr>
  <tr><td class="id">M2</td><td>Well-known payee: biller/notary list, or paid by ≥ 20 customers over ≥ 30 days</td><td class="n">3%</td><td class="n">25%</td><td class="n">−20</td></tr>
  <tr><td class="id">M3</td><td>Anchored device on the usual network</td><td class="n">30%</td><td class="n">70%</td><td class="n">−10</td></tr>
  <tr><td class="id">M4</td><td>Payment or payee declared ≥ 24 h in advance from an anchored device, no control change since</td><td class="n">0.5%</td><td class="n">10%</td><td class="n">−30</td></tr>
  <tr><td class="id">M5</td><td>Within habit: amount, time and payee type as usual</td><td class="n">15%</td><td class="n">50%</td><td class="n">−10</td></tr></tbody></table></div>`,
  simple:`M3 is small on purpose, because coached victims use their own device. Good signs never cancel an override.`,
  chg:`<span class="lbl">Clarified after the PDF</span>Device-based good signs (M3, M5) should not count within 7 days of a control change, as M4 already states. That keeps the alert-card case (A-0042) at 75 even though its device is anchored.`},
 {t:'card', tag:'O1–O4 · Overrides (fixed)', h:'Patterns that must never pass',
  body:`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Pattern</th><th>Minimum</th></tr></thead><tbody>
  <tr><td class="id">O1</td><td>Payee on the mule list</td><td>≥ 90 · Block</td></tr>
  <tr><td class="id">O2</td><td>Session break (R2c) + fresh payee: classic relay attack</td><td>≥ 90 · Block</td></tr>
  <tr><td class="id">O3</td><td>≥ 2 control changes in 24 h + fresh payee + ≥ €1,000: full takeover pattern</td><td>≥ 70 · Hold</td></tr>
  <tr><td class="id">O4</td><td>Customer states "the bank, LuxTrust or police asked me to move it" (Check question or call)</td><td>≥ 70 · Hold</td></tr></tbody></table></div><p class="src">All P1. The auto-tuner never changes overrides; people change them with four eyes (Rail 3).</p>`,
  ex:`O4 exists because no real bank ever asks you to move money. Under the coming Payment Services Regulation, banks will also have to refund victims of bank-staff impersonation.`},
 {t:'sort', must:1, kicker:'Which rule?', q:'Which rule does this signal belong to?', buckets:[{k:'R1',label:'R1'},{k:'R2',label:'R2'},{k:'R3',label:'R3'},{k:'R4',label:'R4'},{k:'R5',label:'R5'},{k:'R6',label:'R6'},{k:'R7',label:'R7'},{k:'R8',label:'R8'}], items:[
   {x:'Pause of 4 minutes on the confirm page',b:'R7'},{x:'€5 test payment, then €1,500 to the same payee',b:'R8'},{x:'VoP says "no match" and the customer continues',b:'R4'},
   {x:'90% of the balance to new payees in 72 h',b:'R5'},{x:'Password reset 5 hours ago',b:'R1'},{x:'Payee is an LDB account that passes money on within hours',b:'R6'},
   {x:'Device first seen 20 minutes ago',b:'R2'},{x:'Amount 6× the customer\'s 95th percentile',b:'R3'}]},
 {t:'mcq', q:'Which signal is worth the most points on its own?', opts:['R1a and R2c, both +50','R6b, +40','R5b, +35','R3a, +20'], a:0, why:'R1a (control change < 24 h, F/G = 117) and R2c (session break, F/G = 133) are the strongest evidence, each +50.'},
