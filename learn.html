 {t:'mcq', must:1, q:'R2a (+20) and R2b (+15) and R2c (+50) all fire. How much does R2 add?', opts:['+50, because R2 is capped at its strongest signal','+85','+70','+20'], a:0, why:'Signals in R2 often fire together, so the rule total is capped at +50 (and R5 at +35) to avoid double counting.'},
 {t:'mcq', q:'Why is R7b (remote-access tool, +35) only priority P2?', opts:['LDB runs in a browser, where remote-access detection is less reliable than in an app','Remote access is never fraud','Because it is a good sign','The brief requires it'], a:0, why:'Limitation 5: browser telemetry is weaker, so F values for R7b and R2c are kept modest and R7b is P2.'},
 {t:'recall', must:1, q:'Name the eight rules and one override from memory.', ans:`<p>R1 control change then money out · R2 unfamiliar access · R3 fresh payee with value at risk · R4 name or purpose contradiction · R5 drain and split · R6 risky destination · R7 scripted or coached session · R8 probe, wake or set-and-forget.</p><p>Overrides: O1 mule list (block), O2 relay (block), O3 two control changes (hold), O4 "the bank asked me" (hold).</p>`}
]},

{id:'cases', part:'B · The design, chapter by chapter', title:'Worked examples and the desk check', sub:'§7 + Appendix C: five cases, the held payment step by step, 17 scenarios', mins:15, steps:[
 {t:'card', tag:'§7 · Table 9', h:'Five cases',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Case</th><th>Signals</th><th class="n">Score</th><th>Action</th></tr></thead><tbody>
  <tr><td>SIM swap, €12,000 instant, 80% of balance</td><td>R1a +50 · R2a +20 · R3a +20 · R3d +10 · R5b +35</td><td class="n">135 (100)</td><td>Block; call with in-app confirmation</td></tr>
  <tr><td>Phone changed, new payee, €4,800 instant (alert card)</td><td>R1b +35 · R3a +20 · R3d +10 · R4b +10</td><td class="n">75</td><td>Hold; call-back</td></tr>
  <tr><td>Coached victim, €18,000, own laptop, name matches</td><td>R3a +20 · R3d +10 · R5b +35 · R7c +10 · M3 −10</td><td class="n">65</td><td>Check + 1-hour release</td></tr>
  <tr><td>Buying a flat, €320,000 to a notary, declared</td><td>R3a +20 · R3d +10 · R5b +35 · M4 −30 · M2 −20 (capped −40)</td><td class="n">25</td><td>Allow</td></tr>
  <tr><td>New customer's rent, €1,450, account 5 days old</td><td>R3a +20 · M4 −30 (landlord declared)</td><td class="n">−10 (0)</td><td>Allow</td></tr></tbody></table></div>`,
  simple:`The two takeovers are blocked or held, the coached victim is slowed, and both honest payments pass without friction.`},
 {t:'num', must:1, q:'Flat purchase: risk signals add to 65; good signs M4 (−30) and M2 (−20). What is the final score?', ans:25, tol:0, work:'Good signs −50 are capped at −40 · 65 − 40 = 25 → Allow'},
 {t:'card', tag:'§7.1 · The held payment, step by step', h:'Case A-0042',
  simple:`<ol><li>Customer for 92 days orders €4,800 instant; usual payments €150–800.</li><li>Link ages: device anchored at onboarding (no R2); phone changed 2 days ago (R1b); payee added 10 min ago (R3a); VoP close match "J. Kovac" vs "J. Kovacs" (R4b); 6× her 95th percentile (R3d).</li><li>35 + 20 + 10 + 10 = <b>75</b>, above the hold line; priority <b>P1</b> from R1b.</li><li>Instant order refused within 10 s with a reason; it waits as a standard transfer, decided by D+1.</li><li>Analyst calls the <b>onboarding</b> phone, not the new one, plus in-app confirmation on the anchored device. Customer didn't make it: stopped, all devices signed out, IBAN on the mule list within minutes.</li></ol>`},
 {t:'num', q:'At 75 points, odds = 2^(75/7) ÷ 19,999 ≈ 1,680 ÷ 19,999. About "1 in how many" is fraud? (round)', ans:13, tol:1, work:'1,680 ÷ 19,999 = 0.084 → odds 1 : 12 → about 1 in 13 payments (p = 0.084/1.084 = 0.078)'},
 {t:'card', tag:'§7.2 · The hardest case', h:'A coached victim on her own laptop',
  simple:`Every link is genuine: her device, her phone, a name that matches. TrustAge doesn't block her. The <b>Check</b> asks directly whether anyone asked her to pay (a "yes" triggers O4), and the cancellable <b>1-hour release</b> gives the scam call time to end, which it often does within the hour. In that hour other customers paying the same IBAN may show up in R6b.`,
  ex:`Like a cooling-off period on a doorstep sale: the pressure fades once the salesman leaves.`},
 {t:'card', tag:'Appendix C', h:'The desk check: 12 frauds, 5 genuine',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Scenario</th><th class="n">Score</th><th>Result</th></tr></thead><tbody>
  <tr><td>F1 Clone site, new device on VPN, €3,000 (60%)</td><td class="n">90</td><td>Block</td></tr>
  <tr><td>F2 Real-time relay, session jumps, new payee (O2)</td><td class="n">90</td><td>Block</td></tr>
  <tr><td>F3 SIM swap, €12,000 instant</td><td class="n">135</td><td>Block</td></tr>
  <tr><td>F4 Stolen cookie, trusted payee's IBAN edited (O2)</td><td class="n">90</td><td>Block</td></tr>
  <tr><td>F5 Fake bank caller, "security transfer", own laptop</td><td class="n">70</td><td>Hold (O4 if she says the bank asked)</td></tr>
  <tr><td>F6 "Tech support" remote access, €6,000</td><td class="n">80</td><td>Hold</td></tr>
  <tr><td>F7 Phished login edits landlord's IBAN, VoP no match</td><td class="n">90</td><td>Block</td></tr>
  <tr><td>F8 Low and slow: €5 test, then 3 × €1,500 via VPN</td><td class="n">65</td><td>Check: slowed</td></tr>
  <tr><td>F9 Mule fan-in: third customer pays same IBAN</td><td class="n">70</td><td>Hold; IBAN to mule list</td></tr>
  <tr><td>F10 Dormant 4 months, new device, 70%</td><td class="n">80</td><td>Hold</td></tr>
  <tr><td>F11 Coached victim, €18,000</td><td class="n">65</td><td>Check: slowed</td></tr>
  <tr><td>F12 Coached victim, €900, within habit</td><td class="n">10</td><td><b>Missed</b></td></tr>
  <tr><td>G1 Flat €320,000 declared · G2 rent · G3 traveller on hotel VPN, trusted payee</td><td class="n">25 · −10 · 10</td><td>Allow</td></tr>
  <tr><td>G4 Car €15,000 new dealer · G5 phone changed, €800 new payee</td><td class="n">45 · 45</td><td>Warn (paid, notified)</td></tr></tbody></table></div>`,
  pro:`9 of 12 frauds stopped (blocked or held), 2 slowed (F8, F11), 1 missed (F12); all 5 genuine paid, two with a notification.`},
 {t:'sort', kicker:'Stopped, slowed or missed?', q:'What happened to this scenario in the desk check?', buckets:[{k:'stop',label:'Stopped',sub:'held or blocked'},{k:'slow',label:'Slowed',sub:'Check + 1-h release'},{k:'miss',label:'Missed',sub:'allowed'}], items:[
   {x:'F3 SIM swap, €12,000',b:'stop'},{x:'F8 €5 test then 3 × €1,500 via VPN',b:'slow'},{x:'F12 coached, €900, within habit',b:'miss'},{x:'F9 mule fan-in',b:'stop'},{x:'F11 coached, €18,000, own laptop',b:'slow'},{x:'F6 remote access "tech support"',b:'stop'}]},
 {t:'mcq', must:1, q:'Why is F12 missed, and what partly covers it?', opts:['A modest payment from her own device leaves almost no new link; the campaign board (purpose spikes) and R6b if the mule is reused, plus shared mule lists later','It is a programming error','It is out of scope because it is card fraud','The hold line is too low'], a:0, why:'§7.4: a rule-based design needs some new link to find. Bank-wide views and data sharing between banks cover part of the gap.'},
 {t:'card', tag:'§7.4 · What the desk check proves', h:'And what it does not',
  simple:`It shows whether each attack reaches the intended action and whether honest customers pass with the <b>launch table</b>. It does <b>not</b> test the F estimates themselves: those are tested by the synthetic-customer run before launch and the calibration check afterwards (Rail 9).`,
  trap:`Don't call the desk check "proof that it works". It is a consistency check of the design, scored by hand.`},
 {t:'recall', q:'Walk through the alert-card case A-0042 in 30 seconds.', ans:`<p>€4,800 instant, 92-day customer. Phone changed 2 days ago: R1b +35. Payee added 10 min ago: R3a +20. 6× her usual: R3d +10. Name close match: R4b +10. Total 75, P1. Instant refused within 10 s, held as standard to D+1. Analyst calls the onboarding phone plus in-app confirmation on the anchored device; she didn't make it, so it's stopped, devices signed out, IBAN on the mule list.</p>`}
]},

{id:'reports', part:'B · The design, chapter by chapter', title:'The five report mockups', sub:'§8: one report per person and decision', mins:10, steps:[
 {t:'card', tag:'§8 · Table 10', h:'Five reports',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Report</th><th>Who · when</th><th>Decision it supports</th></tr></thead><tbody>
  <tr><td>1 Alert card</td><td>Analyst or desk · each hold</td><td>Release, stop or pause, within 15 min (P1) or 1 h (P2)</td></tr>
  <tr><td>2 Queue</td><td>Analyst · live</td><td>What to work on next (priority, then time left)</td></tr>
  <tr><td>3 Campaign board</td><td>Fraud lead · daily</td><td>Warn all customers? Add an IBAN to the mule list?</td></tr>
  <tr><td>4 What TrustAge learned</td><td>Fraud lead, risk · monthly</td><td>Accept or veto the automatic changes; audit evidence</td></tr>
  <tr><td>5 KPI page</td><td>Management · monthly</td><td>Risk within appetite? Staffing enough?</td></tr></tbody></table></div>`},
 {t:'card', tag:'Report 1', h:'The alert card',
  simple:`What the analyst opens for a held payment: <b>one sentence</b> saying why; <b>bars</b> showing which signals added the points; the <b>link ages</b>; the customer snapshot; what the customer was told; the <b>call-back script</b> with tick boxes; and three buttons: Release, Stop + block access, Pause to D+1.`,
  ex:`"Phone number changed 2 days ago, then €4,800 (6× her usual) to a payee added 10 minutes ago whose name only partly matches." · "Similar payments in the past: about 1 in 13 was fraud."`,
  pro:`The ticked answers become the case label. Bottom line: points table v1.4 · decided 10:14:03 · 182 ms.`},
 {t:'card', tag:'Reports 2 and 3', h:'Queue and campaign board',
  simple:`<b>Queue:</b> held payments sorted by priority, then time left. No payment is ever released automatically.<br><b>Campaign board:</b> attacks across customers that no single alert shows: new IBANs paid by several customers (one goes on the mule list automatically), signals today vs a normal day, and a possible scam wave ("9 customers chose the purpose 'security transfer' today, 3.5× normal") with a one-click Send warning.`},
 {t:'card', tag:'Reports 4 and 5', h:'What it learned, and the KPI page',
  simple:`<b>What TrustAge learned:</b> every automatic change with its counts and a one-sentence reason written by the system (e.g. "R3 fresh payee +20 → +25"), drift alarms (a browser update reset device IDs, so R2 was halved for 7 days), and promoted new signals.<br><b>KPI page:</b> fraud stopped, losses vs risk appetite (1 basis point of transfer value), hold precision, holds per day, customer friction, speed. Each fraud tagged with its EBA category for LDB's semi-annual fraud report to the CSSF (PSD2 Art. 96(6)).`,
  chg:`<span class="lbl">Know this for questions</span>The mockups use month-4 <b>example numbers</b> (88% stopped, 6% precision, 2.2 holds a day). They deliberately show more fraud than planned (9 cases in 72,000 transfers, about 1 in 8,000), as expected for a new bank under attack. Our prototype later measured about 80% of takeovers stopped and 5–8 genuine holds a day. Say: the mockups are illustrative; the simulation is the better evidence.<br><br><b>Added 6 Nov:</b> the KPI tab now says where missed fraud comes from: customer claims (2 in month 4, €7,200), so the month's figures are provisional until late claims are in.`},
 {t:'sort', must:1, kicker:'Which report?', q:'Who would open which report to decide this?', buckets:[{k:'card',label:'Alert card'},{k:'queue',label:'Queue'},{k:'board',label:'Campaign board'},{k:'learn',label:'What it learned'},{k:'kpi',label:'KPI page'}], items:[
   {x:'Should we release case A-0042 after the call?',b:'card'},{x:'Which held payment do I handle next?',b:'queue'},{x:'Should all customers get a scam warning today?',b:'board'},
   {x:'Do we veto the change of R2 from 15 to 10?',b:'learn'},{x:'Are losses within our risk appetite this month?',b:'kpi'},{x:'Is one new IBAN being paid by several customers?',b:'board'}]},
 {t:'recall', q:'Name the five reports and their audience.', ans:`<p>Alert card (analyst, each hold) · Queue (analyst, live) · Campaign board (fraud lead, daily) · What TrustAge learned (fraud lead and risk, monthly) · KPI page (management, monthly; feeds CSSF fraud statistics).</p>`}
]},

{id:'adapt', part:'B · The design, chapter by chapter', title:'Adapting without human intervention', sub:'§9: the weekly loop, labels, the recount formula, nine safety rails, ML', mins:18, steps:[
 {t:'card', tag:'§9 · In one sentence', h:'Every Sunday at 03:00 it recounts the evidence',
  simple:`TrustAge recounts F and G for every signal from what really happened and recomputes the points with the <b>same formula</b>. It is plain counting: a person can redo every step in a spreadsheet. No one has to press a button; the fraud lead reads the log and keeps a veto.`,
  ex:`Like a weather app that updates its forecast every week from what the weather actually did.`},
 {t:'order', must:1, q:'Put the learning loop in order.', items:['Decide every payment with the current points table (store reasons and version)','Learn the outcome as it happens (labels)','Recount F and G weekly and recompute the points','Safety test: replay the scenario library and the last 30 days before going live']},
 {t:'card', tag:'§9 · Table 11', h:'Where labels come from',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Source</th><th>When</th><th>Counts as</th></tr></thead><tbody>
  <tr><td>Analyst decision on a hold</td><td>Minutes</td><td>Fraud or genuine (only what was held)</td></tr>
  <tr><td>Customer cancels in the 1-hour release</td><td>Within the hour</td><td>Half a fraud case</td></tr>
  <tr><td>Customer fraud claim (up to 13 months, PSD2)</td><td>Days–months</td><td>Fraud, a missed case: the most useful label</td></tr>
  <tr><td>Receiving bank confirms mule or recall</td><td>Days</td><td>Fraud; IBAN to mule list at once</td></tr>
  <tr><td>Blocked payment, after the call</td><td>Hours</td><td>Fraud if not made by customer, genuine if made</td></tr>
  <tr><td>No complaint 60 days after</td><td>60 days</td><td>Genuine (can still flip); feeds G</td></tr></tbody></table></div>`,
  simple:`A block alone never counts as fraud, so the detector cannot "prove itself right".`},
 {t:'card', tag:'§9.1 · The recount formula', h:'The estimate counts as 20 cases',
  simple:`F<sub>new</sub> = (20 × F<sub>estimate</sub> + fraud cases with the signal) ÷ (20 + all fraud cases). While there are few real cases the estimate dominates; as cases accumulate, the observed share takes over. This is a <b>Bayesian prior</b>.`,
  ex:`A new restaurant rating that starts at "4 stars, as if 20 people had rated it": one angry review can't drop it to 1 star, but 200 reviews will decide it.`,
  pro:`G is measured on the genuine payments of the last <b>90 days</b>, leaving out each customer's <b>first 14 days</b> at LDB: new customers add payees for the first time, and counting them would make fresh payees look normal and weaken R3 just when criminals test the new bank.`},
 {t:'num', must:1, q:'Month 4: 25 confirmed frauds, 21 with a fresh payee; estimate F = 70%. What is the new F (in %)? Round to a whole number.', ans:78, tol:1, work:'(20 × 0.70 + 21) ÷ (20 + 25) = 35 ÷ 45 = 0.778 → 78%'},
 {t:'num', q:'Then measured G = 5.5%. 78 ÷ 5.5 = 14. 7 × log₂ 14 = 26.7. What are the new points this week? (Remember the weekly limit; the old value was +20.)', ans:25, tol:0, work:'26.7 rounds to +25, which is within +5 of +20 → +25. The log reads: "R3 fresh payee +20 → +25: 21 of 25 confirmed frauds had one; only 5.5% of genuine payments do."'},
 {t:'card', tag:'§9 · Table 12', h:'Nine safety rails',
  body:`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Rail</th><th>Protects against</th></tr></thead><tbody>
  <tr><td class="id">1</td><td>Estimate counts as 20 cases</td><td>One or two odd cases swinging a rule</td></tr>
  <tr><td class="id">2</td><td>±5 points per signal per week; floors and ceilings (R1a never below +30)</td><td>Sudden or invisible change</td></tr>
  <tr><td class="id">3</td><td>Overrides and the −40 cap never change by themselves; people, four eyes</td><td>Weakening the block rules</td></tr>
  <tr><td class="id">4</td><td>Safety test: every library scenario (40 at launch, 42 by month 4) still reaches its action; holds on last 30 days under 30/day</td><td>Missing known attacks; flooding analysts</td></tr>
  <tr><td class="id">5</td><td>Drift alarm: G doubles in a week → points halved 7 days, fraud lead told; floors still apply</td><td>A browser update or data fault looking like fraud</td></tr>
  <tr><td class="id">6</td><td>New signals start silent (0 points, measured); promoted at ≥ 5 frauds and F/G ≥ 4, at most +15</td><td>Unproven signals, while new tactics still get covered</td></tr>
  <tr><td class="id">7</td><td>Hold line moves between 65 and 75 to keep holds within capacity; €10,000+ always keeps 70</td><td>Alert overload in a scam wave</td></tr>
  <tr><td class="id">8</td><td>Every version stored with one sentence per change; one-click veto/rollback; monthly risk review</td><td>Loss of control and audit trail</td></tr>
  <tr><td class="id">9</td><td>Calibration: predicted vs real genuine share per band from day 1; fraud odds per band from ~30 frauds (month 5)</td><td>Overlapping signals inflating the score</td></tr></tbody></table></div>`,
  chg:`<span class="lbl">Clarified after the PDF</span>Rail 7 moves the line <b>both ways</b> between 65 and 75 (down when there is spare capacity, up in a scam wave); payments of €10,000 or more always keep 70.`},
 {t:'sort', must:1, kicker:'Which rail?', q:'Which safety rail handles this?', buckets:[{k:'2',label:'Rail 2',sub:'±5, floors'},{k:'3',label:'Rail 3',sub:'overrides fixed'},{k:'5',label:'Rail 5',sub:'drift alarm'},{k:'6',label:'Rail 6',sub:'new signals silent'},{k:'7',label:'Rail 7',sub:'hold line 65–75'}], items:[
   {x:'A browser update suddenly makes "new device" twice as common among genuine logins.',b:'5'},
   {x:'Evidence says R5b should jump from +35 to +45 in one week.',b:'2'},
   {x:'Someone proposes removing O4.',b:'3'},
   {x:'A new idea: "payee added on one device, paid from another within 10 minutes".',b:'6'},
   {x:'A scam wave pushes holds toward 30 a day.',b:'7'}]},
 {t:'card', tag:'§9 · Brief requirement', h:'Adding rules or data without a redesign',
  simple:`The engine reads a <b>versioned points table</b>, so a new signal is a new row, not new code. A new attribute is added in the loader and attribute builder; its signal starts <b>silent at 0 points</b> and is only measured (Rail 6). It is promoted automatically at ≥ 5 frauds and F/G ≥ 4, at most +15, and must pass the safety test.`},
 {t:'card', tag:'§9 · Real-time adaptation', h:'Things that change instantly',
  simple:`A confirmed fraud IBAN joins the <b>mule list within minutes</b>; IBANs paid safely by many customers become "well known"; each customer's baseline is recomputed <b>nightly</b>; devices and payees <b>age into trust</b> without any change to the table.`},
 {t:'card', tag:'§9.3 · Machine learning', h:'Why not at launch, and when',
  simple:`A new bank has no labelled frauds; a supervised model needs a few hundred. At about 25 confirmed frauds in four months that would take years, or need pooled industry data. Once LDB has <b>200–300</b> confirmed cases, a model can run in <b>shadow mode</b> next to the rules, deciding nothing. If ever used, it is documented under the AI Act, although fraud detection is outside the high-risk credit-scoring category (Annex III 5(b)).`,
  means:`<b>Shadow mode</b> = the model scores every payment in parallel and is measured, but its scores don't affect decisions.`},
 {t:'mcq', q:'Why doesn\'t the weekly recount count as machine learning?', opts:['It is plain counting with the same fixed formula that anyone can redo in a spreadsheet','Because it runs on Sundays','Because it uses no data','It is machine learning'], a:0, why:'Counting F and G and applying 7 × log₂(F/G) is transparent statistics; the structure (rules, signals) is defined by people.'},
 {t:'recall', must:1, q:'How does TrustAge adapt without human intervention? (30 seconds)', ans:`<p>Every payment gets a label from analyst calls, cancellations, claims, recalls or 60 days without complaint. Every Sunday at 03:00 it recounts F and G per signal, with our estimate counting as 20 cases, and recomputes the points with the same formula. A new table goes live only if all library scenarios still reach their action and holds stay under capacity. Nine rails: ±5 a week, floors, fixed overrides, drift alarm, silent new signals, hold line 65–75, versions with veto, calibration. The fraud lead reads one sentence per change and can veto.</p>`}
]},

{id:'newbank', part:'B · The design, chapter by chapter', title:'Starting as a brand-new bank', sub:'§10: cold start, early-trusted payees, launch timeline', mins:10, steps:[
 {t:'card', tag:'§10 · Table 13', h:'How it works without history',
  body:`<div class="tbl-wrap"><table><tbody>
  <tr><th>Trust starts at onboarding</th><td>eKYC + LuxTrust registration anchor the device, phone and e-mail from day 1. A takeover always changes something after that (R1, R2).</td></tr>
  <tr><th>Early-trusted payees</th><td>(a) the customer's own account at their old bank that funded LDB, same name confirmed by VoP; (b) payees declared at onboarding (landlord, employer); (c) a preloaded list of Luxembourg billers and notaries.</td></tr>
  <tr><th>Genuine side in 30 days</th><td>&gt; 99.9% genuine, so ~75,000 transfers measure every G.</td></tr>
  <tr><th>Fraud side is borrowed</th><td>F from public cases, the scenario library and shared mule lists; in year 1 most learning comes from G and capacity.</td></tr>
  <tr><th>Stricter first 60 days</th><td>Launch pack: 12-hour cooling-off after any new device, phone or e-mail; that channel cannot approve fresh-payee payments ≥ €1,000.</td></tr>
  <tr><th>New customer's habits</th><td>Usual amount starts from what they declared, blended in with w = min(1, payments/20, days/90).</td></tr></tbody></table></div>`},
 {t:'num', q:'A customer has made 8 payments in 30 days. What is the weight w = min(1, payments/20, days/90)? (decimal, e.g. 0.25)', ans:0.33, tol:0.02, work:'payments/20 = 0.40, days/90 = 0.33 → the smallest is 0.33. So 33% real behaviour, 67% declared at onboarding.'},
 {t:'card', tag:'§10.1 · Launch timeline', h:'Four steps',
  simple:`<ol><li><b>Before launch:</b> points from F estimates and benchmark G, tested on <b>50,000 synthetic customers</b> and the 40 scenarios; biller list and mule feed loaded.</li><li><b>Days 1–30, launch mode:</b> anchors give trust, capacity sets the hold line, G measured daily; weekly recount already runs with ±5. Until day 60, G is counted on all payments minus known frauds and claims (error &lt; 0.01%).</li><li><b>Day 30:</b> a larger, logged recount of G from LDB's own traffic, which must pass the safety test.</li><li><b>From month 3:</b> normal weekly self-tuning; learning on F speeds up as cases accumulate and banks share data.</li></ol>`},
 {t:'order', q:'Put the launch steps in order.', items:['Test on 50,000 synthetic customers and the 40 scenarios','Launch mode: anchors, capacity sets the hold line, daily G','Day 30: larger logged recount of G, safety test','From month 3: normal weekly self-tuning']},
 {t:'mcq', must:1, q:'A customer opened the account 5 days ago and pays rent of €1,450 to a landlord declared at onboarding. Why is it allowed?', opts:['Device and phone are anchored, so R1 and R2 don\'t fire; R3a +20 is offset by M4 −30','Because new customers are never checked','Because €1,450 is below €500','Because the 24/7 desk released it'], a:0, why:'Score −10, shown as 0: Allow. Trust comes from what was verified at onboarding, not from history.'},
 {t:'recall', q:'"How does it work on day one?" Answer in 20 seconds.', ans:`<p>By asking whether each link was verified at onboarding or added later, which needs no history. The onboarding device, phone and e-mail are trusted from day one; payees can be trusted early through the funding account, declared payees and a biller/notary list. G is measured within 30 days, F starts from estimates, and a stricter launch pack runs for 60 days.</p>`}
]},

{id:'cost', part:'B · The design, chapter by chapter', title:'Cost and affordability', sub:'§11: one-off, running, per transfer, break-even', mins:7, steps:[
 {t:'card', tag:'§11 · Table 14', h:'Year-1 cost estimate',
  body:`<div class="tbl-wrap"><table><tbody>
  <tr><th colspan="2">One-off</th></tr>
  <tr><td>Build: engine, attribute builder, results store, console (2 devs + 1 analyst, 6 months)</td><td class="n">€180,000</td></tr>
  <tr><td>Testing: scenario library, 50,000 synthetic customers</td><td class="n">€20,000</td></tr>
  <tr><td>Legal and privacy: fraud-check clause, DPIA, call-script training</td><td class="n">€30,000</td></tr>
  <tr><td><b>One-off total</b></td><td class="n"><b>€230,000</b></td></tr>
  <tr><th colspan="2">Running, per year</th></tr>
  <tr><td>Fraud analysts 2 × €85,000</td><td class="n">€170,000</td></tr>
  <tr><td>Fraud lead (half the role)</td><td class="n">€65,000</td></tr>
  <tr><td>Night and weekend cover (share of 24/7 desk)</td><td class="n">€90,000</td></tr>
  <tr><td>On-call allowance</td><td class="n">€15,000</td></tr>
  <tr><td>Data feeds (IP reputation, remote-access script, threat feed)</td><td class="n">€50,000</td></tr>
  <tr><td>Run and maintain (~20% of build a year)</td><td class="n">€40,000</td></tr>
  <tr><td><b>Running total</b></td><td class="n"><b>€430,000</b></td></tr></tbody></table></div>`},
 {t:'card', tag:'§11 · Does it pay?', h:'Break-even and payback',
  simple:`<ul><li>A dedicated in-house 24/7 seat would need ~5 people, ~€425,000 a year alone; sharing the ops desk costs about a fifth.</li><li>Month-4 example: €51,200 stopped in a month, about <b>€600,000 a year</b>.</li><li>Most stopped fraud is LDB's own money: the bank must refund unauthorised transactions (PSD2 Art. 73), and the PSR will extend refunds to bank-staff impersonation.</li><li>Running cost covered once stopped losses exceed about <b>€36,000 a month</b> (430,000 ÷ 12); one-off paid back in <b>under two years</b>.</li><li><b>≈ €0.48 per transfer</b> in year 1 (€430k ÷ ~900,000 transfers), falling as volume grows.</li></ul>`,
  ex:`About 2 holds a day use only a small part of the analysts' time; the rest goes to claims, recalls, mule reporting, AML referrals and the campaign board, and the capacity of 30 a day is there for scam waves.`},
 {t:'num', must:1, q:'Running cost €430,000 a year. Above how many euros of stopped fraud per month does TrustAge pay for itself? (thousands, e.g. 36)', ans:36, tol:1, work:'430,000 ÷ 12 = 35,833 ≈ €36,000 a month'},
 {t:'mcq', q:'Why is most stopped fraud LDB\'s own money?', opts:['PSD2 Art. 73 makes the bank refund unauthorised transactions','Because customers are insured','Because the CSSF pays','It isn\'t; it is the customers\' loss'], a:0, why:'A takeover is an unauthorised payment, which the payer\'s bank must refund. The PSR will add refunds for bank-staff impersonation scams.'}
]},

{id:'limits', part:'B · The design, chapter by chapter', title:'Limitations and regulatory fit', sub:'§12: the seven limits we admit, and every law that applies', mins:14, steps:[
 {t:'card', tag:'§12.1 · Limits 1–4', h:'What TrustAge cannot do well',
  simple:`<ol><li><b>Coached victim</b> on her own device, matching name: slowed (Check, scam question, 1-hour release), not stopped if she lies.</li><li><b>Fraud side learns slowly:</b> ~25 confirmed frauds in four months, so F stays near the estimates in year 1.</li><li><b>Single-victim mule</b> is invisible to R6b until banks share data.</li><li><b>No card fraud</b> or other channels.</li></ol>`},
 {t:'card', tag:'§12.1 · Limits 5–7', h:'Technical limits',
  simple:`<ol start="5"><li><b>Browser, not app:</b> remote access (R7b) and session fingerprints (R2c) are harder to see; their F values are modest and R7b is P2.</li><li><b>Mules may open accounts at LDB:</b> R6c sees money passing through, but stopping them at opening is a KYC and AML task.</li><li><b>Adding points assumes independent signals.</b> Caps and the calibration check limit the error but cannot remove it.</li></ol>`},
 {t:'card', tag:'After the PDF', h:'Two more limits we found',
  chg:`<ul><li><b>Patient criminal:</b> someone who waits until R1 (7 days), R2a (24 h) and R3b (30 days) expire scores only about 15 and is allowed. Mitigations: 30 days of warnings to the old phone and e-mail; a SIM swap cuts the owner's own phone; M1 needs two payments 30 days apart, so the payee never becomes trusted. Fix we would add: links created by a new device right after a control change only age into trust after confirmation on the anchored device.</li><li><b>Overconfident odds:</b> in the prototype, summed points overstated the real fraud odds in the 70+ bands (about 13×), exactly what limitation 7 predicts. Rail 9 handles it: the odds shown should come from measured shares per band; the action thresholds can stay.</li></ul>`},
 {t:'card', tag:'§12.2 · Table 15 (1/2)', h:'Payments law',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Requires</th><th>TrustAge</th></tr></thead><tbody>
  <tr><td>PSD2 SCA RTS, Reg. 2018/389 Art. 2</td><td>Monitoring: compromised credentials, amount, known scenarios, malware, abnormal device use</td><td>R1/R2c, R3d/R5, R6/R8 + library, R7b, R2a</td></tr>
  <tr><td>PSD2 Art. 68(2), 79, 83, 97</td><td>SCA; block only with contract; refuse with reasons; D+1</td><td>On top of SCA; fraud-check clause; reason on screen; every hold decided by D+1</td></tr>
  <tr><td>PSD2 Art. 96(6), EBA fraud-reporting GL</td><td>Fraud statistics to the CSSF</td><td>Labels and EBA categories on the KPI page</td></tr>
  <tr><td>Instant Payments Reg. 2024/886</td><td>10 seconds; VoP since 9 Oct 2025</td><td>&lt; 0.3 s; R4 uses VoP</td></tr>
  <tr><td>PSR (agreed Nov 2025, not in force)</td><td>Impersonation refunds; fraud-data sharing</td><td>O4; R6 ready for shared mule data</td></tr></tbody></table></div>`},
 {t:'card', tag:'§12.2 · Table 15 (2/2)', h:'Data, AI, resilience, outsourcing, AML',
  body:`<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Requires</th><th>TrustAge</th></tr></thead><tbody>
  <tr><td>GDPR Art. 22, 35</td><td>Limits on solely automated decisions; DPIA</td><td>Human review of every hold and block; reason codes; DPIA; age band never scored</td></tr>
  <tr><td>EU AI Act</td><td>Fraud detection excluded from high-risk credit scoring (Annex III 5(b))</td><td>Rules + simple statistics; document if ML is added</td></tr>
  <tr><td>DORA, Reg. 2022/2554</td><td>ICT resilience, incidents, third parties</td><td>Fail mode, speed KPI, outsourcing controls</td></tr>
  <tr><td>EBA outsourcing GL, CSSF 22/806</td><td>Controls over outsourcing</td><td>Contract, LDB keeps the rules, recorded calls, monthly audit</td></tr>
  <tr><td>Luxembourg AML law; AMLR from 10 July 2027</td><td>Report suspicious activity to the FIU (CRF)</td><td>R6c and confirmed mules go to AML</td></tr></tbody></table></div>`},
 {t:'sort', must:1, kicker:'Which law?', q:'Which rule does this design choice answer?', buckets:[{k:'psd2',label:'PSD2',sub:'Art. 73, 79, 83, 96, 97'},{k:'ipr',label:'Instant Payments Reg.'},{k:'gdpr',label:'GDPR'},{k:'dora',label:'DORA'},{k:'ai',label:'AI Act'}], items:[
   {x:'A person decides every hold and block, with reason codes.',b:'gdpr'},{x:'TrustAge answers in under 0.3 s.',b:'ipr'},{x:'A fixed fallback when the detector is down, plus an incident process.',b:'dora'},
   {x:'Every hold is decided by the next business day.',b:'psd2'},{x:'R4 uses the Verification of Payee result.',b:'ipr'},{x:'If ML is ever added, it is documented, although fraud detection is not high-risk.',b:'ai'},{x:'A DPIA before launch.',b:'gdpr'},{x:'The bank refunds unauthorised payments, so stopped fraud saves LDB\'s own money.',b:'psd2'}]},
 {t:'mcq', q:'Is TrustAge "solely automated decision-making" under GDPR Art. 22?', opts:['Only low-risk decisions are automatic; every hold and block is decided by a person with reason codes','Yes, fully','No, because it is not personal data','Only on weekends'], a:0, why:'Allow, Warn and Check are automatic; anything that stops a payment goes to a human, which is the safeguard Art. 22 expects.'},
 {t:'recall', q:'Name three limitations you would raise yourself, and what mitigates each.', ans:`<ul><li>Coached victim on own device: slowed by Check + 1-hour release; real fix is shared mule data.</li><li>Patient criminal: old-channel warnings for 30 days; fix: links after a control change age only after anchored-device confirmation.</li><li>Independence assumption: caps, conditional add-ons, calibration (Rail 9).</li></ul>`}
]},

/* ═════════════ PART C · AFTER THE PDF ═════════════ */
{id:'changed', part:'C · After the PDF', chg:1, title:'Changed since the PDF, and the prototype', sub:'Everything that is different from the 24 October report, in one place', mins:12, steps:[
 {t:'card', tag:'Why this block', h:'The professor reads the PDF; you defend the current version',
  simple:`The PDF is his question source. Everything in it still holds. After 24 October we reviewed it, built a prototype and the final deck. A few points were <b>clarified</b>, a few <b>results</b> were added. If he asks about one of these, say what the PDF says, then what we found or would change.`},
 {t:'card', tag:'Clarifications', h:'Four rules we made precise',
  chg:`<ol><li><b>Missing essential field</b> counts as the risky value of its signal (unknown device age = new device +20; missing name check = R4c +5). The PDF only says "adds points".</li><li><b>Rail 7</b> moves the hold line both ways between 65 and 75; €10,000+ always keeps 70.</li><li><b>M3/M5</b> (device-based good signs) don't count within 7 days of a control change, like M4. This explains why A-0042 stays at 75.</li><li><b>R8b</b> cannot fire before month 4, since no account can be dormant 90 days in a younger bank.</li></ol>`},
 {t:'card', tag:'The prototype', h:'A working TrustAge on synthetic data',
  simple:`Plain HTML/JavaScript. It encodes the full points table, caps, good-sign cap, overrides, five actions and priorities, and reproduces <b>all 32 point values and the desk-check scenarios</b> of the report. It generates synthetic customers and the 12 attack routes, simulates LDB week by week with analyst calls, late labels (claims arrive in 1–4 weeks, 10% never), the weekly auto-tuner and the rails.`,
  trap:`The data is <b>synthetic and built from our own assumptions</b>. It tests the rules and the tuner; it does not prove that real fraud looks like this.`},
 {t:'card', tag:'Prototype results', h:'What the simulation says',
  ex:`<div class="stats"><div class="stat"><b>≈ 80%</b><span>of takeovers stopped (routes F1–F4, F10: 80–100%)</span></div><div class="stat"><b>≈ 25%</b><span>of coached victims stopped (14–35%); the rest slowed</span></div><div class="stat"><b>5–8</b><span>genuine holds a day (report planned ~2.2; capacity 30)</span></div><div class="stat"><b>65% / 78%</b><span>stopped by count / by value at 1 in 20,000 over 52 weeks (target 85%)</span></div></div>`,
  simple:`Hold precision was about 1% (target 5%), and summed points overstated the real odds in the top bands. It still beats naive rules: "hold every new payee over €500" catches 81–87% but flags about 200 genuine payments a day; "new payee plus new device or VPN" flags 16 a day but catches only 38–56%.`},
 {t:'card', tag:'Honest framing', h:'How to talk about the numbers',
  simple:`<ul><li>Mockup numbers (88% stopped, 2.2 holds a day) are <b>illustrative</b>.</li><li>Simulation numbers are <b>better evidence but synthetic</b>.</li><li>The design is <b>strong on takeovers, weak on coached victims</b>, and below the 85% value target in simulation; the levers are the hold line, shared mule data and more labels.</li></ul>`,
  hook:`"Strong on takeovers, honest about the rest."`},
 {t:'card', tag:'The final deck', h:'What the slides show differently',
  simple:`<ul><li>No presenter names; photos and names only on slides 1 and 10.</li><li>Slide 2 shows five routes (the PDF table has eight).</li><li>Slide 9 shows the desk-check split (9 of 12 stopped, 2 slowed, 1 missed, 5 of 5 honest paid) and the patient-criminal limit. The prototype numbers are not on the slides; keep them for Q&A.</li><li>Slide 6 shows the alert priorities (P1 15 min, P2 1 h, P3 next business day).</li><li>The title slide leaves out the course name: the report and brief say "Corporate Risk Assessment and Digital Transformation"; the evaluation sheet says "Digital Finance Law, Regulation and Compliance".</li></ul>`},
 {t:'mcq', must:1, q:'The professor says: "Your KPI page claims 88% stopped." Best answer?', opts:['Those are illustrative month-4 mockup numbers; our synthetic prototype stops about 80% of takeovers and about a quarter of coached victims','It is measured on real data','88% is guaranteed by the formula','We don\'t know where it comes from'], a:0, why:'Be honest and precise: label the mockup as illustrative, then give the simulation numbers and their limits.'},
 {t:'mcq', q:'How many genuine holds a day did the prototype produce, and is that a problem?', opts:['About 5–8, more than the planned 2.2 but far below the capacity of 30; Rail 7 can raise the line','About 200, a serious problem','Zero','About 30, exactly at capacity'], a:0, why:'Still manageable for two analysts plus the 24/7 desk; the naive "new payee over €500" rule would flag about 200 a day.'},
 {t:'recall', q:'List the four clarifications made after the PDF.', ans:`<ol><li>Missing essential field = risky value of its signal.</li><li>Rail 7 moves both ways 65–75; €10k+ keeps 70.</li><li>M3/M5 don't count within 7 days of a control change.</li><li>R8b can't fire before month 4.</li></ol>`}
]},

{id:'claims', part:'C · After the PDF', chg:1, title:'When fraud gets through: claims and complaints', sub:'Review comment of 6 Nov: how a missed fraud reaches the reports, drawn in the architecture', mins:15, steps:[
 {t:'card', tag:'The comment', h:'"If a fraud passes and a customer complains, how does it reach the report?"',
  simple:`The PDF already uses the claim, but only as a <b>label</b> (Table 11: "Customer's fraud claim, up to 13 months: the most useful label, because it shows what the detector missed") and in the analysts' workload (§11). What was missing: the <b>path</b> in the architecture, who does what, and how the reports show it. The deck now draws it: a red <b>Customer claim</b> box → console → results store → reports and auto-tuner.`,
  ex:`A smoke alarm that never hears about the fires it missed can never get better. The claim is the fire report.`,
  chg:`<span class="lbl">Added on 6 November</span>Slide 4 has two new steps (claim opens a case; linked to its stored decision, it counts as missed fraud). Slide 3: "every call answer and every customer claim becomes a label". Slide 7, KPI tab: "Missed fraud comes from customer claims: 2 this month (€7,200)… figures are provisional."`},
 {t:'card', tag:'The path', h:'From "I didn\'t make this payment" to the reports',
  simple:`<ol><li><b>Customer reports it</b> in the app or by phone. PSD2 allows up to <b>13 months</b> (Art. 71).</li><li><b>A case opens on the console</b>, linked to the payment's <b>stored decision</b> in the results store: score, signals, table version, what the customer was told.</li><li><b>Stop the damage</b>: sign out all devices, reset login and LuxTrust, IBAN on the <b>mule list</b> within minutes, <b>recall request</b> to the receiving bank.</li><li><b>Refund decision</b> (unauthorised: by the end of the next business day, Art. 73).</li><li><b>Label</b> written on the original decision: "fraud, missed" (or "genuine" if it turns out the customer made it).</li><li><b>Reports</b>: KPI page (missed fraud, losses vs appetite, EBA category for the CSSF); campaign board (who else paid that IBAN?); "What it learned" (counts in F).</li><li><b>Sunday recount</b> counts its signals in F. If the pattern is new, the fraud lead adds it to the <b>scenario library</b> (Rail 4).</li></ol>`},
 {t:'order', must:1, q:'Put the missed-fraud path in order.', items:['Customer reports a payment they did not make','A case opens on the console, linked to the stored decision','Block access, mule-list the IBAN, ask the receiving bank to recall','Refund decision (unauthorised: by the next business day)','Label "missed fraud" written on the original decision','KPI page, campaign board and the Sunday recount pick it up']},
 {t:'card', tag:'Why it matters most', h:'Without claims, TrustAge would only learn what it already catches',
  simple:`Holds give labels only for payments TrustAge <b>already</b> found suspicious. If F were counted from holds alone, a signal that fires on every held fraud would look perfect, and a route it misses would never show up. That is a <b>self-confirming loop</b>. A claim is the only label from the payments TrustAge <b>let through</b>.`,
  ex:`F12 (coached victim, €900, scored 10, allowed). Weeks later she claims. Her payment's signals (R3a fresh payee, M3 own device) are counted in F. If many claims share a pattern, e.g. purpose "investment", a new signal is proposed and starts silent (Rail 6).`,
  trap:`This only works if the results store keeps the value of <b>every</b> signal for every payment, including signals that scored 0 and silent new ones. Otherwise a claim six months later cannot be recounted. Keep the record for at least the 13-month claim window; AML law already requires 5 years.`},
 {t:'card', tag:'The law around a claim', h:'What PSD2 makes LDB do',
  pro:`<ul><li><b>Art. 71</b>: the customer must report without undue delay, at most <b>13 months</b> after the debit.</li><li><b>Art. 73</b>: an <b>unauthorised</b> payment is refunded by the end of the <b>next business day</b>, unless LDB has reasonable grounds to suspect the customer's own fraud and tells the CSSF in writing.</li><li><b>Art. 72</b>: LDB must <b>prove</b> the payment was authenticated and recorded; the log alone is not proof of consent. The results store and the recorded call-back are that evidence.</li><li><b>Art. 74</b>: gross negligence can shift the loss to the customer, decided after investigation.</li><li><b>Art. 101</b>: answer a complaint within <b>15 business days</b> (35 in exceptional cases).</li><li><b>Coached victim</b> (authorised): no PSD2 refund duty today; the PSR will add refunds for bank-staff impersonation. It is still labelled fraud for learning and reporting.</li><li>Confirmed mule → AML report to the CRF.</li></ul>`},
 {t:'card', tag:'The other complaint', h:'"You held my rent": complaints from honest customers',
  simple:`Not every complaint is about missed fraud. An honest customer whose payment was held or blocked can complain too. Same case log, linked to the same stored decision. The label is <b>genuine</b>, it counts in the <b>customer-friction</b> KPI and in G, and it gets an answer within 15 business days.`,
  ex:`If one signal keeps causing such complaints (e.g. VPN for cross-border workers), its G rises and the recount lowers its points; the slide-7 log shows exactly that: R2 VPN 15 → 10.`},
 {t:'card', tag:'In the reports', h:'Where a claim shows up',
  simple:`<ul><li><b>KPI page</b>: "Fraud stopped 88%: €51,200 of €58,400". The €58,400 total exists only because claims tell us about the €7,200 we missed (2 claims in month 4). Since claims can arrive up to 13 months later, the month is <b>provisional</b> and is updated when a late claim arrives.</li><li><b>Campaign board</b>: the claimed IBAN joins the mule list; other customers paying it are checked (O1, R6b).</li><li><b>What TrustAge learned</b>: "21 of 25 confirmed frauds had a fresh payee": the 25 include frauds found through claims.</li><li><b>CSSF</b>: each fraud carries its EBA category for the semi-annual report (PSD2 Art. 96(6)).</li></ul>`},
 {t:'mcq', must:1, q:'Three weeks later a customer says she did not make a €2,000 payment that TrustAge allowed at 25 points. What happens in the reports?', opts:['Her payment\'s stored decision is labelled "missed fraud"; the KPI page adds the loss to that month; the IBAN joins the mule list; Sunday\'s recount counts its signals in F','Nothing: TrustAge only learns from held payments','The analyst deletes the old decision and re-scores it','Only the CSSF is told'], a:0, why:'The claim is linked to the stored decision (never overwritten: the store is append-only), labelled, counted on the KPI page and in the next recount.'},
 {t:'mcq', q:'Why must the results store keep signals that scored 0 points?', opts:['So a claim months later can still be counted in F for every signal, including silent new ones','To make the database bigger','Because GDPR requires it','It doesn\'t need to'], a:0, why:'F is "share of frauds with the signal". To count a missed fraud for a signal, you need to know whether that signal was present, even if it scored nothing at the time.'},
 {t:'mcq', q:'The KPI page says "88% stopped" for month 4. Why is that number provisional?', opts:['Claims can arrive up to 13 months later and add missed frauds to that month','Because the analysts guessed it','Because the formula changes weekly','It is final'], a:0, why:'Late claims raise the denominator (frauds attempted) and the losses, so the month is updated.'},
 {t:'recall', must:1, q:'Answer the comment in 30 seconds: "A fraud passes and the customer complains. How is it added to the report?"', ans:`<p>The claim opens a case on the console, linked to the payment's stored decision in the results store. The analyst blocks access, puts the IBAN on the mule list and asks the receiving bank to recall; an unauthorised payment is refunded by the next business day. The decision is labelled "missed fraud": it appears on the KPI page as a loss (each with its EBA category for the CSSF), and Sunday's recount counts its signals in F. It is our most useful label, because it is the only way TrustAge learns what it missed. Slide 4 now draws this path.</p>`}
]},

/* ═════════════ PART D · EXAM ═════════════ */
{id:'hot', part:'D · Exam practice', title:'Q&A hot seat', sub:'Likely professor questions with model answers, timed', mins:25, steps:[
 {t:'card', tag:'How this works', h:'Answer out loud before you reveal',
  simple:`Each question has a 30-second timer. Answer as if you were in D10D, then compare. Shaky answers come back at the end and in the morning refresh.`,
  ex:`A strong answer: <b>direct answer</b> → <b>one number or example from the report</b> → stop. Never invent a number.`},
 {t:'qa', secs:30, must:1, q:'"How exactly does a payment get its score?"', ans:`<p>Each signal that fires adds its points from the points table; every number there comes from 7 × log₂(F/G). The engine adds them, caps R2 at +50, R5 at +35 and good signs at −40, applies any override minimum, and maps the total to an action. A-0042: 35 + 20 + 10 + 10 = 75, so Hold.</p>`},
 {t:'qa', secs:30, must:1, q:'"Where do F and G come from if LDB has no history?"', ans:`<p>G is measured: over 99.9% of payments are genuine, so 30 days (~75,000 transfers) pins it down. F starts as the weighted share of our 40 library scenarios showing the signal, reviewed by the team, and is corrected weekly; a factor-2 error moves the points by only 7.</p>`},
 {t:'qa', secs:30, q:'"Why 7, and why 70?"', ans:`<p>With 7, every 7 points doubles the odds, so 70 means ×1,000. At 1 in 20,000 that is about 1 hold in 20 being fraud; at €5,000 average loss each hold prevents ~€250, far more than 15 minutes of analyst time. Capacity and friction set the limit, so Rail 7 can move it between 65 and 75.</p>`},
 {t:'qa', secs:30, must:1, q:'"How does it adapt without human intervention?"', ans:`<p>Every Sunday at 03:00 it recounts F and G from labelled outcomes and recomputes the points with the same formula, estimate counting as 20 cases. A new table goes live only if every library scenario still reaches its action and holds stay under 30 a day. The fraud lead reads the log and can veto.</p>`},
 {t:'qa', secs:30, q:'"What stops the self-tuning from going wrong or being gamed?"', ans:`<p>The rails: ±5 a week, floors (R1a never below +30), overrides fixed, drift alarm with floors, safety test, versions with rollback, calibration. A criminal would need weeks of fake "normal" traffic and would still hit the floors.</p>`},
 {t:'qa', secs:30, q:'"Why no machine learning?"', ans:`<p>No labelled frauds at a new bank; a model needs a few hundred and LDB sees ~25 in four months. Rules with counted weights are explainable and auditable, as the brief demands. At 200–300 cases a model can run in shadow mode.</p>`},
 {t:'qa', secs:30, must:1, q:'"How do you tell honest but unusual payments from fraud?"', ans:`<p>Good signs: trusted payee −25, well-known −20, anchored device −10, declared in advance −30, within habit −10, capped at −40. The €320,000 flat: 65 on risk signals, 25 after good signs, Allow. A €15,000 car, not declared: 45, Warn.</p>`},
 {t:'qa', secs:30, q:'"What happens to a held instant payment?"', ans:`<p>Refused within 10 seconds with a reason (PSD2 Art. 79), then continued as a standard transfer under LDB's terms (A6), which the customer can cancel and which must arrive by D+1 (Art. 83). So every hold is decided by D+1.</p>`},
 {t:'qa', secs:30, q:'"What if TrustAge is down?"', ans:`<p>After 0.5 s of silence: trusted payees go through; €1,000+ to fresh payees waits as standard; if still down at the D+1 cut-off an analyst decides by hand; DORA incident process.</p>`},
 {t:'qa', secs:30, q:'"Who answers at night, and can a small bank afford it?"', ans:`<p>One 24/7 seat needs ~5 people (168 ÷ 33 h; Matzak). So LDB's 24/7 desk runs the same script, may release clean holds up to €10,000, and an analyst is on call. About a fifth of a dedicated seat, safe because a held payment hasn't left.</p>`},
 {t:'qa', secs:30, must:1, q:'"Why call the safe phone, and what after a SIM swap?"', ans:`<p>The safe phone is trusted 30+ days or anchored at onboarding, never a number from a message. After a SIM swap the criminal could answer, so when R1 fired or the device is new the customer must also confirm in the app on the anchored device, or pass in-app video ident against the eKYC selfie.</p>`},
 {t:'qa', secs:30, q:'"How does it work on day one?"', ans:`<p>It asks whether each link was verified at onboarding or added later. Onboarding device, phone and e-mail are trusted from day one; early-trusted payees via funding account, declared payees, biller/notary list; baseline from declared amounts blended with w = min(1, payments/20, days/90).</p>`},
 {t:'qa', secs:30, q:'"Why isn\'t SCA enough?"', ans:`<p>SCA proves someone has the credentials, not who is behind them. Takeovers pass with stolen or relayed codes, or the real customer approves a steered payment. TrustAge looks at what SCA doesn't: link age.</p>`},
 {t:'qa', secs:30, q:'"How do you add a new rule without redesigning?"', ans:`<p>A new signal is a new row in the versioned points table. Its attribute is added to the loader and builder; it starts silent at 0 points (Rail 6), is promoted at ≥ 5 frauds and F/G ≥ 4, at most +15, and must pass the safety test.</p>`},
 {t:'qa', secs:30, q:'"What does the analyst see, and how does a call become a label?"', ans:`<p>The alert card: one-sentence why, point bars, link ages, what the customer was told, the four-step script. The analyst ticks the answers and clicks Release, Stop or Pause; that is stored as fraud or genuine and feeds the recount.</p>`},
 {t:'qa', secs:30, q:'"Is this automated decision-making under GDPR?"', ans:`<p>Only low-risk decisions are automatic; every hold and block is decided by a person with reason codes. DPIA before launch, legitimate interest (Recital 47), hashed device IDs, age band never scored.</p>`},
 {t:'qa', secs:30, q:'"What goes to the regulator?"', ans:`<p>Each fraud is tagged with its EBA category on the KPI page, feeding the semi-annual fraud report to the CSSF (PSD2 Art. 96(6)). The results store keeps every decision with its table version for audit.</p>`},
 {t:'qa', secs:30, q:'"What does it cost, and does it pay back?"', ans:`<p>€230,000 one-off, €430,000 a year, ~€0.48 per transfer. Break-even at ~€36,000 stopped a month; payback under two years; stopped fraud is mostly LDB's own money (PSD2 Art. 73).</p>`},
 {t:'qa', secs:30, must:1, q:'"A criminal can just wait until the links age. Doesn\'t that break your idea?"', ans:`<p>Admit it: waiting lowers the score, to about 15. But waiting has costs: warnings go to the old phone and e-mail for 30 days, a SIM swap cuts the owner's own phone, the payee never becomes trusted. The fix: links created right after a control change only age into trust after confirmation on the anchored device.</p>`},
 {t:'qa', secs:30, must:1, q:'"Adding points assumes independent signals. Isn\'t the score overconfident?"', ans:`<p>Yes, that is limitation 7. Add-ons are measured only among fresh-payee payments, R2 and R5 are capped, good signs capped at −40. The prototype still showed overstated odds in the top bands, which is what the calibration check (Rail 9) corrects; the actions stay the same.</p>`},
 {t:'qa', secs:30, q:'"Payer manipulation is the fastest-growing fraud and you miss F12. Aren\'t you missing the main threat?"', ans:`<p>We catch the coached cases that leave a trace (F5, F6, F9 stopped). A modest payment from the victim's own device leaves almost nothing for any single-bank rule; we slow those down, and the real fix is shared mule data across banks, which the PSR will bring.</p>`},
 {t:'qa', secs:30, q:'"Your F values are guesses. How is that not guesswork?"', ans:`<p>G is measured. F is a documented estimate that counts as 20 cases and is overwritten by real outcomes weekly; on a log scale a factor-2 error is just 7 points.</p>`},
 {t:'qa', secs:30, q:'"In A-0042 the device is anchored. Why doesn\'t M3 apply?"', ans:`<p>Device-based good signs shouldn't count right after a control change, as M4 already states. We'd write that into M3 and M5 explicitly; the case stays at 75.</p>`},
 {t:'qa', secs:30, must:1, q:'"If a fraud passes and the customer complains, how does it reach your reports?"', ans:`<p>The claim opens a case on the console, linked to the stored decision. Block access, IBAN to the mule list, recall request, refund by the next business day if unauthorised (PSD2 Art. 73). The decision is labelled "missed fraud": KPI page loss with its EBA category, and Sunday's recount counts it in F. Slide 4 shows the path.</p>`},
 {t:'qa', secs:30, q:'"Your KPI page shows 88% stopped in month 4. How can you know that already?"', ans:`<p>We can't fully: missed frauds come from claims, which can arrive up to 13 months later. The month is provisional and is updated when a late claim arrives. And the 88% is an illustrative mockup number; the prototype gave about 80% of takeovers.</p>`},
 {t:'qa', secs:30, q:'"Doesn\'t learning from your own holds just confirm your own rules?"', ans:`<p>It would, which is why claims, recalls from receiving banks and the 60-day genuine label also feed the recount. Claims are the only window on what we let through, so the results store keeps every signal's value, even at 0 points, for every payment.</p>`},
 {t:'qa', secs:30, q:'"What if an honest customer complains about a hold?"', ans:`<p>Same case log, linked to the decision, labelled genuine; it counts in the friction KPI and in G, so a signal that annoys honest customers loses points at the recount. PSD2 Art. 101: answer within 15 business days.</p>`},
 {t:'qa', secs:30, q:'"Which assumption is weakest?"', ans:`<p>A8, the starting F values. Labelled as estimates, cheap errors on a log scale, replaced weekly. Second: A3, the 1-in-20,000 rate, replaced by LDB's measured rate from month 1.</p>`}
]},

{id:'slides', part:'D · Exam practice', sec:1, title:'The presentation (secondary)', sub:'The 10 slides: key line and what to say', mins:12, steps:[
 {t:'card', tag:'Format', h:'Your 20-minute slot',
  simple:`2 min setup · <b>10 min presentation</b> (the evaluator may stop you) · <b>7 min individual Q&A</b> · 1 min changeover. Everyone presents at least one slide. Each of you gets at least one question on your own part, but can be asked about anything. Teammates stay silent. The last slide (photos) stays on during Q&A.`,
  ex:`Topics the evaluator checks: intro and purpose · TOM · fraud behaviour and assumptions · architecture · data features · rules and logic · reports · anything relevant.`},
 {t:'card', tag:'Slides 1–3', h:'Title · purpose and fraud · operating model',
  simple:`<b>1:</b> "We stop account takeover before the money leaves."<br><b>2:</b> "Every takeover has to add something new": the owner's green links flip red (device, phone, session, payee, destination) with their routes; assumptions.<br><b>3:</b> "The machine decides most. People decide holds": flowing payments; 70+ drops to the analyst and the 4-step call; labels feed weekly learning; oversight.`},
 {t:'card', tag:'Slides 4–6', h:'Architecture · data · scoring',
  simple:`<b>4:</b> one payment travels: online banking → hub asks "is this safe?" → loader → attributes → engine → answer in 0.3 s → results → reports; then a missed fraud: <b>customer claim</b> → case on the console → stored decision labelled "missed" → reports; weekly loop; instant and fail mode.<br><b>5:</b> "34 attributes, and none needs history": five groups around link age.<br><b>6:</b> the formula; R3a example 70/8 → +20; the takeover stacks to 75 → Hold; the flat falls to 25 → Allow; eight rules, good signs, overrides, and the P1/P2/P3 priorities.`},
 {t:'card', tag:'Slides 7–10', h:'Reports · learning · results · close',
  simple:`<b>7:</b> five report tabs (click or →): alert card, queue, campaign board, what it learned, KPI page.<br><b>8:</b> "Every Sunday it recounts the evidence": loop, R3 +20 → +25, rails.<br><b>9:</b> desk check: 9 of 12 stopped, 2 slowed, 1 missed, 5 of 5 honest paid; three limits; law and €0.48 per transfer.<br><b>10:</b> "TrustAge measures the one thing a criminal cannot fake: the age of each link."`},
 {t:'recall', q:'Say your own slides out loud, one key line each.', tip:'Then open the deck and practise with the presenter window (P) and its timer.', ans:`<p>1 We stop takeover before the money leaves · 2 A criminal can steal a password but cannot make a link old · 3 The machine decides below 70, a person decides every hold · 4 Everything inside LDB, an answer in 0.3 s · 5 The key feature is link age · 6 Every 7 points doubles the odds · 7 One report per person and decision · 8 It recounts every Sunday inside nine rails · 9 Strong on takeovers, honest about coached victims · 10 The age of each link is what a criminal cannot fake.</p>`}
]},

{id:'am', part:'D · Exam practice', dynamic:1, title:'Morning refresh', sub:'Only what you missed, plus the must-knows', mins:15, steps:[]}
];

const ALL = {}, MUST = [];
BLOCKS.forEach(b => b.steps.forEach((s,i) => { s.id = b.id + '-' + i; s.bid = b.id; ALL[s.id] = s; if (s.must) MUST.push(s.id); }));

/* ---------- state ---------- */
const KEY = 'trustage-zero-v1';
function load(){ const d = {done:{}, missed:{}, sprints:0}; try { return Object.assign(d, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ return d; } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const app = $('#app');
let view = 'home', R = null, tick = null, hist = [];
function stopAll(){ if (tick){ clearInterval(tick); tick = null; } try { speechSynthesis.cancel(); } catch(e){} }
const ago = t => { const d = Math.floor((Date.now()-t)/86400000), h = Math.floor((Date.now()-t)/3600000), m = Math.floor((Date.now()-t)/60000); return d ? d+' d' : h ? h+' h' : Math.max(1,m)+' min'; };

/* ---------- home ---------- */
function home(){
  stopAll(); view = 'home'; R = null; hist = [];
  const core = BLOCKS.filter(b => !b.dynamic);
  const doneN = BLOCKS.filter(b => S.done[b.id]).length;
  const missN = Object.keys(S.missed).filter(id => ALL[id]).length;
  const steps = core.reduce((a,b) => a + b.steps.length, 0);
  const next = core.find(b => !S.done[b.id] && !b.sec) || core.find(b => !S.done[b.id]) || BLOCKS.find(b => b.dynamic);
  let lastPart = '';
  app.innerHTML = `
  <section class="hero">
    <p class="eyebrow">Oral exam · Saturday 7 November · from 08:30 · D10D</p>
    <h1>TrustAge <em>from zero</em></h1>
    <p class="lede">Our whole fraud detector in plain words, everyday examples and the exact wording of the final report, the professor's question source. Where we changed something after the PDF, you learn the new version, marked <b style="color:var(--chg)">Changed since the PDF</b>. Each block you finish becomes an anchored link in your chain.</p>
    <div class="statline"><span><b>${doneN}</b> / ${BLOCKS.length} links anchored</span><span><b>${steps}</b> steps in total</span><span><b>${missN}</b> queued for the morning</span><span><b>${S.sprints}</b> focus sprints</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="mapGo">Idea map: every idea connected</button><button class="btn ghost sm" id="labGo">Score lab: build any case</button></div>
  </section>
  <ol class="chain">${BLOCKS.map((b,i) => {
    const done = S.done[b.id], isNext = b === next;
    const head = b.part !== lastPart ? `</ol><div class="part">${b.part}</div><ol class="chain">` : ''; lastPart = b.part;
    const n = b.dynamic ? (missN ? `${missN} missed + must-knows` : 'must-knows') : `${b.steps.length} steps`;
    return `${head}<li class="${done?'done':''} ${isNext?'nextup':''}"><span class="node" aria-hidden="true"></span>
      <button class="blk" data-b="${b.id}">
        <span class="blk-head"><span class="mono">LINK #${i+1}</span><span class="mono">${done ? 'anchored ' + ago(done) + ' ago' : 'fresh link'}</span></span>
        <h3>${b.title}</h3><p>${b.sub}</p>
        <span class="blk-head" style="justify-content:flex-start"><span class="mono">~${b.mins} min · ${n}</span>
        ${b.start ? '<span class="chip start">Beginner start</span>' : ''}${b.chg ? '<span class="chip chg">After the PDF</span>' : ''}${b.sec ? '<span class="chip sec">Secondary</span>' : ''}${done ? '<span class="chip on">Anchored</span>' : isNext ? '<span class="chip next">Next up</span>' : ''}</span>
      </button></li>`; }).join('')}</ol>
  <div class="homefoot"><button class="btn" id="go">${next && !S.done[next.id] ? 'Start: ' + next.title : 'Run the morning refresh'}</button><button class="btn ghost" id="cs">Open cheat sheet</button><button class="btn ghost sm" id="rs">Reset progress</button></div>
  <div id="cf"></div>`;
  $$('.blk').forEach(b => b.onclick = () => startBlock(b.dataset.b));
  $('#go').onclick = () => startBlock(next.id);
  $('#cs').onclick = () => openView(sheet);
  $('#mapGo').onclick = () => openView(map);
  $('#labGo').onclick = () => openView(lab);
  $('#rs').onclick = () => { $('#cf').innerHTML = `<div class="confirm"><span>Clear your chain and missed items?</span><button class="btn bad sm" id="rsy">Clear everything</button><button class="btn ghost sm" id="rsn">Keep</button></div>`;
    $('#rsy').onclick = () => { S = {done:{}, missed:{}, sprints:0}; save(); home(); }; $('#rsn').onclick = () => $('#cf').innerHTML = ''; };
  window.scrollTo(0,0);
}

/* ---------- runner ---------- */
function buildMorning(){
  const missed = Object.keys(S.missed).filter(id => ALL[id]);
  const extra = MUST.filter(id => !missed.includes(id) && ALL[id].bid !== 'basics');
  const list = missed.concat(extra).slice(0, Math.max(16, missed.length)).map(id => ALL[id]);
  return [{t:'card', id:'am-intro', tag:'Good morning', h: missed.length ? `${missed.length} things to fix, then the must-knows` : 'No misses. Running the must-knows', simple:'Fifteen minutes. Answer fast and out loud. Anything you get right here leaves the review queue.'},
    ...list,
    {t:'card', id:'am-out', tag:'Before you walk in', h:'Seven sentences that answer most questions', body:`<p><b>Idea:</b> every takeover adds a new link; a criminal cannot make a link old.</p><p><b>Points:</b> 7 × log₂(F/G); every 7 points doubles the odds; 70 ≈ ×1,000 ≈ 1 hold in 20 is fraud.</p><p><b>People:</b> below 70 the machine decides; a person decides every hold after a four-step call, by D+1.</p><p><b>Learning:</b> every Sunday it recounts F and G, estimate = 20 cases, inside nine rails; fraud lead can veto.</p><p><b>New bank:</b> trust is anchored at onboarding; G measured in 30 days.</p><p><b>Evidence:</b> desk check 9/12, 2 slowed, 1 missed, 5/5 genuine; prototype ≈80% takeovers, ≈25% coached.</p><p><b>Limits:</b> coached victims, patient criminals, independence assumption, single-victim mules.</p>`, hook:'A criminal can steal a password, but cannot make a link old.'}];
}
function startBlock(id){
  stopAll();
  const b = BLOCKS.find(x => x.id === id);
  const steps = b.dynamic ? buildMorning() : b.steps;
  R = {b, q: steps.map(s => ({s, re:false})), i:0, right:0, miss:0};
  view = 'run'; renderStep();
}
function next(){ stopAll(); R.i++; R.i >= R.q.length ? finish() : renderStep(); }
function prevStep(){ if (!R || R.i === 0 || R.i >= R.q.length) return; stopAll(); R.i--; renderStep(); }
function good(s){ const q = R.q[R.i]; if (q.res) return; q.res = 1; R.right++; if (R.b.dynamic && S.missed[s.id]) { delete S.missed[s.id]; save(); } }

function scoreOf(on){

    llab.attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2 - 4); node.attr('transform', d => `translate(${d.x},${d.y})`); };

    const k = Math.min(W / (x1 - x0), H / (y1 - y0), 1.4); const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2); (dur ? svg.transition().duration(dur) : svg).call(zoom.transform, t); };

  M.highlight(M.nb[id], inc); M.node.classed('on', d => d.id === id); M.center(n);
  const edges = M.links.filter(inc);
  const nav = M.tour >= 0 ? `<div class="tournav"><button class="btn ghost sm" id="tp" ${M.tour === 0 ? 'disabled' : ''}>← Back</button><span class="mono">Story step ${M.tour + 1} / ${TOUR.length}</span><button class="btn sm" id="tn">${M.tour === TOUR.length - 1 ? 'Finish' : 'Next →'}</button></div>` : '';
  $('#mpanel').innerHTML = `${nav}<div class="kicker"><span class="gdot" style="background:${GC[n.g]}"></span>${GL[n.g]} · ${n.s}</div><h2>${n.l}</h2>
   <div class="lay"><div class="simple"><span class="lbl" style="color:var(--pri)">In simple words</span>${n.t}</div><div class="ex"><span class="lbl">Example</span>${n.e}</div></div>
   <h3 class="ch">Connected to (${edges.length})</h3><div class="conns">${edges.map(l => { const o = l.source.id === id ? l.target : l.source; return `<button class="conn" data-id="${o.id}"><i style="background:${GC[o.g]}"></i><span>${linkText(l, id)}</span></button>`; }).join('')}</div>`;
  $$('#mpanel .conn').forEach(b => b.onclick = () => { M.tour = -1; select(b.dataset.id); });
  if (M.tour >= 0){ $('#tp').onclick = () => { M.tour--; select(TOUR[M.tour]); };
    $('#tn').onclick = () => { if (M.tour === TOUR.length - 1){ M.tour = -1; M.highlight(null); M.node.classed('on', false); M.fit(400); panelIntro('You walked the whole design. Now try Connect the dots.'); } else { M.tour++; select(TOUR[M.tour]); } }; }
  if (fromTap && innerWidth < 700) $('#mpanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function groupView(k){ const M = MAP; M.tour = -1; const members = M.nodes.filter(n => n.g === k), ids = new Set(members.map(n => n.id));
  M.highlight(ids, l => ids.has(l.source.id) && ids.has(l.target.id)); M.node.classed('on', false);
  $('#mpanel').innerHTML = `<div class="kicker"><span class="gdot" style="background:${GC[k]}"></span>Group · ${members.length} ideas</div><h2>${GL[k]}</h2><div class="conns">${members.map(n => `<button class="conn" data-id="${n.id}"><i style="background:${GC[n.g]}"></i><span><b>${n.l}</b> <em>${n.t}</em></span></button>`).join('')}</div>`;
  $$('#mpanel .conn').forEach(b => b.onclick = () => select(b.dataset.id)); }
function dotsQuiz(){ const M = MAP; M.tour = -1; const l = M.links[Math.floor(Math.random() * M.links.length)], a = l.source, b = l.target, ids = new Set([a.id, b.id]);
  M.highlight(ids, x => x === l, true); M.node.classed('on', d => ids.has(d.id)); M.center({x:(a.x + b.x) / 2, y:(a.y + b.y) / 2});
  $('#mpanel').innerHTML = `<div class="kicker">Connect the dots</div><h2>How are “${a.l}” and “${b.l}” connected?</h2><p class="tip">Say the link out loud in one sentence. Then reveal.</p>
   <div class="ans" id="qa" hidden><p>${linkText(l, '')}</p><p><b>${a.l}:</b> ${a.t}</p><p><b>${b.l}:</b> ${b.t}</p></div>
   <div class="actions"><button class="btn" id="qr">Reveal the link</button><button class="btn ghost" id="qn">Another pair</button></div>`;
  $('#qr').onclick = () => { $('#qa').hidden = false; M.llab.classed('show', x => x === l); $('#qr').disabled = true; }; $('#qn').onclick = dotsQuiz; }

/* ---------- focus timer ---------- */
let ac = null;
function beep(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.7); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.75); } catch(e){} }
const F = {left:300, iv:null}, fBtn = $('#focus');
function fDraw(){ $('#fTime').textContent = Math.floor(F.left/60) + ':' + String(F.left%60).padStart(2,'0'); $('#fIcon').textContent = F.iv ? '❚❚' : '▶'; fBtn.setAttribute('aria-pressed', F.iv ? 'true' : 'false'); }
function fStart(){ if (F.left <= 0) F.left = 300; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  F.iv = setInterval(() => { F.left--; if (F.left <= 0){ clearInterval(F.iv); F.iv = null; F.left = 300; S.sprints++; save(); beep(); $('#brk').hidden = false; if (view === 'home') home(); } fDraw(); }, 1000); fDraw(); }
fBtn.onclick = () => { if (F.iv){ clearInterval(F.iv); F.iv = null; fDraw(); } else fStart(); };
$('#brkGo').onclick = () => { $('#brk').hidden = true; fStart(); };
$('#brkClose').onclick = () => { $('#brk').hidden = true; };
$('#brand').onclick = home;
$('#sheetBtn').onclick = () => openView(sheet);
$('#mapBtn').onclick = () => openView(map);
$('#labBtn').onclick = () => openView(lab);
document.addEventListener('keydown', e => {
  if (view !== 'run' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Enter' && e.target.tagName !== 'BUTTON') || (e.key === ' ' && e.target === document.body)){ const p = $('#act [data-primary]'); if (p){ e.preventDefault(); p.click(); } }
  else if (e.key === 'ArrowLeft') prevStep();
  else if (/^[1-9]$/.test(e.key)){ const b = $(`#stage [data-key="${e.key}"]:not(:disabled)`); if (b) b.click(); }
});
home();
</script>
